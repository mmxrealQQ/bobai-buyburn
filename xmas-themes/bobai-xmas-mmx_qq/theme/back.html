<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
// "BOBAI Builds Xmas on BNB" — quiet edition (21 Nov 2026): no backdrop, only light and a little paint. A painted fir
// wound with slowly turning light strings and a gold star, gifts at BOBAI's feet, a garland along the top, a ring of
// lights at each station. The chain moves it: a buy lays one more gift and lights one tree light, a burn flares the
// BURN ring, a liquidity add sends a wave up the tree, a big buy makes the star shine and sparks rise from it.
// SMOOTH (operator: "it must be more fluid"): every glow is a pre-painted sprite, the fir and each gift are painted once
// into their own small canvas and only placed per frame, every change runs on the frame's time, not the frame count.
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = innerWidth, H = innerHeight, dpr = 1, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, on = true;
  let L = null; // the last layout
  const GOLD = '#F0B90B', WARM = '#ffe7b0';
  const ST_COL = { burnA: '#ff8a1f', liq: '#2ee6c8', creator: '#c9b8a8', burnB: '#ffc247', defi: '#60a5fa', giggle: '#f472b6' };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

  // ---- glow sprites: one soft round light per colour, painted once -----------------------------------------------------
  const SPR = {};
  function sprite(col) {
    if (SPR[col]) return SPR[col];
    const c = mk(64, 64), g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, col); gr.addColorStop(0.25, col + 'aa'); gr.addColorStop(1, col + '00');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (SPR[col] = c);
  }
  function glow(x, y, r, col, a) { if (a <= 0.004) return; cx.globalAlpha = Math.min(1, a); cx.drawImage(sprite(col), x - r, y - r, r * 2, r * 2); cx.globalAlpha = 1; }
  const DOT = {};
  function dotSpr(col) { if (DOT[col]) return DOT[col]; const c = mk(16, 16), g = c.getContext('2d'); g.fillStyle = col; g.beginPath(); g.arc(8, 8, 7.5, 0, 6.283); g.fill(); return (DOT[col] = c); }
  function dot(x, y, r, col, a) { cx.globalAlpha = Math.min(1, a); cx.drawImage(dotSpr(col), x - r, y - r, r * 2, r * 2); cx.globalAlpha = 1; }

  // ---- the tree ------------------------------------------------------------------------------------------------------
  const LIGHTS = [];
  function buildLights(n) {
    LIGHTS.length = 0;
    for (let s = 0; s < 2; s++) for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n; // 0 top .. 1 bottom
      const col = Math.random() < 0.14 ? ['#ff7a66', '#2ee6c8', '#ffc247'][Math.floor(Math.random() * 3)] : (Math.random() < 0.55 ? WARM : GOLD);
      LIGHTS.push({ t, a: t * 5.2 * Math.PI * 2 + s * Math.PI, col, ph: rnd(0, 6.28), sp: rnd(0.25, 0.7), boost: 0 });
    }
  }
  let tree = { x: 0, y: 0, h: 0, w: 0 }, star = 0, wave = -1, rot = 0;
  // the painted fir: soft brush strokes in four tiers, deep green with a few strokes of gold ink, painted once per layout
  let fir = null;
  function paintFir() {
    const { h, w } = tree, pad = 6, c = mk((w + pad * 2) * dpr, (h + pad * 2) * dpr), g = c.getContext('2d');
    g.scale(dpr, dpr); g.translate(pad + w / 2, pad); g.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      const t0 = 0.08 + k * 0.22, t1 = t0 + 0.34, n = W < 600 ? 10 : 15;
      for (let i = 0; i < n; i++) for (const side of [-1, 1]) {
        const ts = t0 + rnd(0, 0.06), te = Math.min(1, t1 + rnd(-0.04, 0.04)), spread = rnd(0.55, 1.05) * (i / n * 0.6 + 0.4);
        const y0 = h * ts, y1 = h * te, hw = (w / 2) * te * spread, gold = Math.random() < 0.1, a = rnd(0.1, 0.22);
        g.strokeStyle = gold ? `rgba(240,185,11,${a * 0.8})` : `rgba(46,128,86,${a})`; g.lineWidth = rnd(1.4, 3.4) * (W < 600 ? 0.8 : 1);
        g.beginPath(); g.moveTo(side * 1.5, y0); g.quadraticCurveTo(side * hw * (0.45 + rnd(-0.12, 0.12)), y0 + (y1 - y0) * 0.35, side * hw, y1); g.stroke();
      }
    }
    g.strokeStyle = 'rgba(255,231,176,0.18)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, h * 0.08); g.lineTo(0, h); g.stroke();
    fir = { c, pad };
  }
  // glass baubles on the tree, turning with it
  const TB = [[0.3, 0.6, ['#d9343a', '#7a0d14']], [0.42, 2.9, ['#F0B90B', '#8a5a00']], [0.52, 4.6, ['#2ee6c8', '#0c5a52']], [0.63, 1.4, ['#f4f1ea', '#9a948a']], [0.72, 3.8, ['#d9343a', '#7a0d14']], [0.81, 5.6, ['#F0B90B', '#8a5a00']], [0.89, 0.2, ['#2ee6c8', '#0c5a52']], [0.95, 2.2, ['#f4f1ea', '#9a948a']]];
  const BAUB = {};
  function baubleSpr(c0, c1) {
    const k = c0 + c1; if (BAUB[k]) return BAUB[k];
    const c = mk(48, 48), g = c.getContext('2d'), gr = g.createRadialGradient(18, 18, 2, 24, 24, 22);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.18, c0); gr.addColorStop(1, c1);
    g.fillStyle = gr; g.beginPath(); g.arc(24, 24, 22, 0, 6.283); g.fill();
    g.strokeStyle = 'rgba(255,248,220,0.35)'; g.lineWidth = 1.2; g.stroke();
    return (BAUB[k] = c);
  }

  // ---- the garland along the top --------------------------------------------------------------------------------------
  let garland = [], baubles = [];
  function buildGarland() {
    // along the very top edge, like a garland over a door: shallow, behind the terminal's own labels
    const spans = W < 600 ? 3 : 5, y0 = 3, sag = W < 600 ? 10 : 14;
    garland = []; baubles = [];
    const cols = [['#d9343a', '#7a0d14'], [GOLD, '#8a5a00'], ['#2ee6c8', '#0c5a52'], ['#f4f1ea', '#9a948a']];
    for (let i = 0; i < spans; i++) {
      const x1 = (i / spans) * W, x2 = ((i + 1) / spans) * W;
      garland.push({ x1, x2, y: y0, sag });
      // on a wide screen the top row is full of buttons: there the baubles hang on the tree
      if (W < 600) baubles.push({ x: (x1 + x2) / 2, y: y0 + sag, len: rnd(7, 15), r: 7 * rnd(0.85, 1.15), c: cols[i % cols.length], ph: rnd(0, 6.28), amp: rnd(0.05, 0.1), kick: 0 });
    }
  }

  // ---- gifts at BOBAI's feet: a few to start, one more for every buy (the oldest of a full pile fades away) -----------
  const GIFT_COL = [['#b3202a', '#6e0f16', '#F0B90B'], ['#F0B90B', '#9a6a00', '#b3202a'], ['#1f8a7e', '#0c4a43', '#f4f1ea'], ['#f4f1ea', '#b9b2a6', '#b3202a'], ['#3a5bd0', '#1c2f78', '#F0B90B'], ['#6b2fa0', '#38145a', '#F0B90B']];
  let gifts = [], figBox = null;
  function paintGift(w, s, c) { // painted once into its own canvas: box, lid, ribbon with a sheen, a bow, a fine ink line
    const pad = 4, bwid = Math.max(5, w * 0.22), top = bwid * 0.9, cw = w + pad * 2 + 4, ch = s + top + pad * 2;
    const cnv = mk(cw * dpr, ch * dpr), g = cnv.getContext('2d'); g.scale(dpr, dpr); g.translate(cw / 2, pad + top + s);
    const rr = (x, y, ww, hh, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + ww, y, x + ww, y + hh, r); g.arcTo(x + ww, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + ww, y, r); g.closePath(); };
    const bx = -w / 2, by = -s;
    const gr = g.createLinearGradient(bx, by, bx + w, 0); gr.addColorStop(0, c[0]); gr.addColorStop(1, c[1]);
    g.fillStyle = gr; rr(bx, by, w, s, 2.5); g.fill(); g.strokeStyle = 'rgba(255,244,214,0.35)'; g.lineWidth = 0.9; g.stroke();
    // a soft painted highlight down the left face
    const hl = g.createLinearGradient(bx, 0, bx + w * 0.5, 0); hl.addColorStop(0, 'rgba(255,255,255,0.16)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; rr(bx, by, w * 0.5, s, 2.5); g.fill();
    const lh = s * 0.22, lg = g.createLinearGradient(0, by - 1, 0, by + lh); lg.addColorStop(0, 'rgba(255,255,255,0.3)'); lg.addColorStop(1, 'rgba(255,255,255,0.04)');
    g.fillStyle = c[0]; rr(bx - 2, by - 1.5, w + 4, lh, 2.5); g.fill(); g.fillStyle = lg; rr(bx - 2, by - 1.5, w + 4, lh, 2.5); g.fill();
    g.strokeStyle = 'rgba(255,244,214,0.3)'; g.lineWidth = 0.8; rr(bx - 2, by - 1.5, w + 4, lh, 2.5); g.stroke();
    const rw = Math.max(3, w * 0.13), rg = g.createLinearGradient(-rw / 2, 0, rw / 2, 0); rg.addColorStop(0, c[2]); rg.addColorStop(0.5, '#fffbe8'); rg.addColorStop(1, c[2]);
    g.fillStyle = rg; g.fillRect(-rw / 2, by - 1.5, rw, s + 1.5);
    g.globalAlpha = 0.9; g.fillStyle = c[2]; g.fillRect(bx - 2, by + lh * 0.3, w + 4, Math.max(2, rw * 0.6)); g.globalAlpha = 1;
    const bh = bwid * 0.62;
    g.fillStyle = c[2];
    g.beginPath(); g.ellipse(-bwid * 0.62, by - bh * 0.7, bwid * 0.62, bh * 0.62, -0.35, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(bwid * 0.62, by - bh * 0.7, bwid * 0.62, bh * 0.62, 0.35, 0, 6.283); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.beginPath(); g.ellipse(-bwid * 0.62, by - bh * 0.7, bwid * 0.27, bh * 0.24, -0.35, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(bwid * 0.62, by - bh * 0.7, bwid * 0.27, bh * 0.24, 0.35, 0, 6.283); g.fill();
    g.fillStyle = c[2]; g.beginPath(); g.arc(0, by - bh * 0.55, bh * 0.42, 0, 6.283); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 0.7; g.beginPath(); g.arc(0, by - bh * 0.55, bh * 0.42, 3.6, 5.2); g.stroke();
    return { c: cnv, cw, ch, ax: cw / 2, ay: pad + top + s };
  }
  function mkGift(i, shown) {
    const s = (W < 600 ? 24 : 40) * rnd(0.82, 1.15), w = s * rnd(1.05, 1.4);
    const col = GIFT_COL[(i * 3 + Math.floor(rnd(0, 6))) % GIFT_COL.length];
    return { slot: i, s, w, spr: paintGift(w, s, col), k: shown, out: 0, tilt: rnd(-0.05, 0.05) };
  }
  function seedGifts() { gifts = []; for (let i = 0; i < 4; i++) gifts.push(mkGift(i, 1)); }
  let spots = [];
  function buildSpots() { // the places at his feet, nearest first, alternating sides; none inside the log box
    const f = figBox || { x: W * 0.4, y: H * 0.25, w: W * 0.2, h: H * 0.55 }, log = L && L.ui && L.ui.log;
    const cxF = f.x + f.w / 2, y = f.y + f.h * 0.94, gap = W < 600 ? 30 : 50;
    spots = [];
    for (let step = 0; spots.length < 12 && step < 10; step++) for (const side of [-1, 1]) {
      const x = cxF + side * (f.w * 0.22 + step * gap), yy = y + (step % 2) * 4;
      if (log && x > log.x - 30 && x < log.x + log.w + 30 && yy > log.y - 10 && yy < log.y + log.h) continue;
      if (x < 24 || x > W - 24) continue;
      if (Math.abs(x - tree.x) < tree.w * 0.6 && yy > tree.y - tree.h && yy < tree.y + 30) continue; // not into the tree
      spots.push({ x, y: yy });
    }
  }
  function drawGift(g) {
    const a = Math.min(1, g.k) * (1 - g.out); if (a <= 0) return;
    const p = spots[Math.min(g.slot, spots.length - 1)] || { x: W / 2, y: H * 0.8 };
    const e = Math.min(1, g.k), drop = (1 - e) * (1 - e) * 22; // eases down, softly
    cx.globalAlpha = 0.32 * a; cx.fillStyle = '#000'; cx.beginPath(); cx.ellipse(p.x, p.y + 1, g.w * 0.62, 3.6, 0, 0, 6.283); cx.fill();
    cx.save(); cx.globalAlpha = a; cx.translate(p.x, p.y - drop); cx.rotate(g.tilt);
    cx.drawImage(g.spr.c, -g.spr.ax, -g.spr.ay, g.spr.cw, g.spr.ch); cx.restore(); cx.globalAlpha = 1;
  }
  function addGift() {
    const live = gifts.filter((g) => !g.out);
    if (live.length >= 9) live[0].out = 0.001;
    const used = new Set(gifts.filter((g) => g.out < 1).map((g) => g.slot));
    let slot = 0; while (used.has(slot) && slot < 12) slot++;
    gifts.push(mkGift(slot, 0));
  }

  // ---- sparks rising from the star after a big buy ----------------------------------------------------------------------
  let sparks = [];
  const sparkle = (n) => { for (let i = 0; i < n; i++) sparks.push({ x: tree.x + rnd(-6, 6), y: tree.y - tree.h, vx: rnd(-10, 10), vy: rnd(-26, -12), life: 0, max: rnd(1.6, 3), r: rnd(0.8, 1.8) }); };

  // ---- layout -----------------------------------------------------------------------------------------------------------
  const ring = {}; // station k -> { flare }
  function place() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 1.5); // soft light needs no more pixels; fewer = smoother
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // the tree stands where the fewest of the terminal's things are (stations and their names, the brain, the log, BOBAI)
    const f = L && L.figure ? L.figure : { x: W * 0.4, y: H * 0.25, w: W * 0.2, h: H * 0.55 };
    const ui = (L && L.ui) || {}, tl = ui.timeline, topBox = ui.top;
    figBox = f;
    let floor = Math.min(H - 8, tl && tl.y > H * 0.5 ? tl.y - 4 : f.y + f.h);
    // upright (phone): the tab bar above the timeline is not in the layout: no lower than just under the lowest station's name
    if (H > W && L && L.stations) { const low = Math.max(...Object.values(L.stations).map((p) => p.y)); floor = Math.min(floor, low + 70); }
    const ceil = topBox ? topBox.y + topBox.h + 40 : 90;
    const h = Math.max(110, Math.min(floor - ceil, H * (W < 600 ? 0.3 : 0.44), 380)), w = h * 0.5;
    const pts = [];
    if (L && L.stations) for (const k in L.stations) { const p = L.stations[k]; pts.push([p.x, p.y, 80], [p.x, p.y + 40, 70]); }
    if (L && L.brain) pts.push([L.brain.x, L.brain.y, (L.brain.r || 90) * 1.5 + 70]);
    if (L && L.trades) pts.push([L.trades.x, L.trades.y, 50]);
    const boxes = [f, ui.log].filter(Boolean);
    let best = null;
    for (let fl = floor; fl >= ceil + h; fl -= 24) for (let x = w / 2 + 6; x <= W - w / 2 - 6; x += 12) {
      const bx = x - w / 2, by = fl - h; let pen = 0;
      for (const [px, py, r] of pts) { const dx = Math.max(bx - px, 0, px - (bx + w)), dy = Math.max(by - py, 0, py - fl); const d = Math.hypot(dx, dy); if (d < r) pen += (r - d) * 3; }
      for (const b of boxes) { const ox = Math.max(0, Math.min(bx + w, b.x + b.w) - Math.max(bx, b.x)), oy = Math.max(0, Math.min(fl, b.y + b.h) - Math.max(by, b.y)); pen += ox * oy / 40; }
      pen += Math.min(x, W - x) * 0.02 + (floor - fl) * 0.05;
      if (!best || pen < best.pen) best = { x, fl, pen };
    }
    tree = { x: best ? best.x : W - w, y: best ? best.fl : floor, h, w };
    buildLights(W < 600 ? 34 : 52); paintFir(); buildGarland(); buildSpots();
    if (!gifts.length) seedGifts();
  }

  // ---- drawing ------------------------------------------------------------------------------------------------------------
  function drawStar(x, y, r, t) {
    const breathe = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(t * 0.8);
    glow(x, y, r * (3.4 + star * 2.6), GOLD, 0.2 + 0.08 * breathe + star * 0.35);
    cx.save(); cx.translate(x, y); cx.rotate(reduced ? 0 : Math.sin(t * 0.35) * 0.05);
    cx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    cx.closePath();
    const g = cx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#fff6cf'); g.addColorStop(0.5, GOLD); g.addColorStop(1, '#a86f00');
    cx.fillStyle = g; cx.fill(); cx.strokeStyle = 'rgba(255,248,220,0.6)'; cx.lineWidth = 0.8; cx.stroke(); cx.restore();
  }
  function drawTree(t, dt) {
    const { x, y, h, w } = tree, top = y - h;
    glow(x, y, w * 0.8, GOLD, 0.12);
    if (fir) cx.drawImage(fir.c, x - w / 2 - fir.pad, top - fir.pad, w + fir.pad * 2, h + fir.pad * 2);
    for (const pass of [0, 1]) {
      for (let s = 0; s < 2; s++) { // the strings, back half first
        cx.beginPath(); let first = true;
        for (let i = 0; i <= 110; i++) {
          const tt = i / 110, a = tt * 5.2 * Math.PI * 2 + s * Math.PI + rot, z = Math.cos(a);
          if ((z >= 0) !== !!pass) { first = true; continue; }
          const px = x + Math.sin(a) * tt * w / 2, py = top + h * 0.06 + tt * h * 0.94;
          if (first) { cx.moveTo(px, py); first = false; } else cx.lineTo(px, py);
        }
        cx.strokeStyle = pass ? 'rgba(255,231,176,0.28)' : 'rgba(255,231,176,0.09)'; cx.lineWidth = pass ? 1.1 : 0.8; cx.stroke();
      }
      for (const l of LIGHTS) {
        const a = l.a + rot, z = Math.cos(a);
        if ((z >= 0) !== !!pass) continue;
        const px = x + Math.sin(a) * l.t * w / 2, py = top + h * 0.06 + l.t * h * 0.94, depth = (z + 1) / 2;
        const tw = reduced ? 0.85 : 0.78 + 0.22 * Math.sin(t * l.sp + l.ph); // a soft glimmer, never a blink
        const wv = wave >= 0 ? Math.max(0, 1 - Math.abs(l.t - (1 - wave)) * 6) : 0;
        const k = (0.3 + 0.7 * depth) * (tw + l.boost + wv);
        const r = (W < 600 ? 1.5 : 1.9) * (0.7 + 0.5 * depth) * (1 + l.boost * 0.7 + wv * 0.5);
        glow(px, py, r * 5.5, l.col, 0.34 * k);
        dot(px, py, r, l.col, 0.5 + 0.45 * k);
        if (l.boost > 0) l.boost = Math.max(0, l.boost - dt * 0.6);
      }
      for (const [bt, ba, bc] of TB) {
        const a = ba + rot, z = Math.cos(a);
        if ((z >= 0) !== !!pass) continue;
        const px = x + Math.sin(a) * bt * w / 2 * 0.92, py = top + h * 0.06 + bt * h * 0.94 + 5, r = (W < 600 ? 3.4 : 4.8) * (0.65 + 0.35 * (z + 1) / 2);
        cx.globalAlpha = 0.45 + 0.55 * (z + 1) / 2; cx.drawImage(baubleSpr(bc[0], bc[1]), px - r, py - r, r * 2, r * 2); cx.globalAlpha = 1;
      }
    }
    drawStar(x, top + h * 0.02, (W < 600 ? 9 : 13) * (1 + star * 0.25), t);
  }
  function drawGarland(t) {
    for (const g of garland) {
      cx.beginPath();
      for (let i = 0; i <= 24; i++) { const u = i / 24, px = g.x1 + (g.x2 - g.x1) * u, py = g.y + Math.sin(u * Math.PI) * g.sag; i ? cx.lineTo(px, py) : cx.moveTo(px, py); }
      cx.strokeStyle = 'rgba(46,120,80,0.5)'; cx.lineWidth = W < 600 ? 3 : 4; cx.lineCap = 'round'; cx.stroke();
      cx.strokeStyle = 'rgba(240,185,11,0.32)'; cx.lineWidth = 0.8; cx.stroke();
      for (let i = 1; i < 8; i++) { const u = i / 8, px = g.x1 + (g.x2 - g.x1) * u, py = g.y + Math.sin(u * Math.PI) * g.sag;
        const tw = reduced ? 0.85 : 0.75 + 0.25 * Math.sin(t * 0.6 + i * 1.7 + g.x1), col = i % 3 ? WARM : GOLD;
        glow(px, py, 7, col, 0.32 * tw); dot(px, py, 1.4, col, 0.55 + 0.4 * tw); }
    }
    for (const b of baubles) {
      const sw = reduced ? 0 : Math.sin(t * 0.9 + b.ph) * b.amp + b.kick * Math.sin(t * 5);
      const bx = b.x + Math.sin(sw) * b.len, by = b.y + Math.cos(sw) * b.len;
      cx.strokeStyle = 'rgba(240,185,11,0.5)'; cx.lineWidth = 0.8; cx.beginPath(); cx.moveTo(b.x, b.y); cx.lineTo(bx, by - b.r); cx.stroke();
      cx.fillStyle = GOLD; cx.fillRect(bx - b.r * 0.28, by - b.r - 3, b.r * 0.56, 3.5);
      cx.drawImage(baubleSpr(b.c[0], b.c[1]), bx - b.r, by - b.r, b.r * 2, b.r * 2);
      glow(bx, by, b.r * 2.4, b.c[0], 0.1 + b.kick * 2);
    }
  }
  function drawRings(t, dt) {
    const st = L && L.stations; if (!st) return;
    for (const k in st) {
      const p = st[k], col = ST_COL[k] || GOLD, R = ring[k] || (ring[k] = { flare: 0 }), n = 8, rad = (W < 600 ? 26 : 34) * (1 + R.flare * 0.25);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * 6.283 + (reduced ? 0 : t * 0.2), px = p.x + Math.cos(a) * rad, py = p.y + Math.sin(a) * rad * 0.42 + rad * 0.55;
        const tw = reduced ? 0.75 : 0.65 + 0.35 * Math.sin(t * 1.2 + i);
        glow(px, py, 6 + R.flare * 6, col, (0.22 + R.flare * 0.6) * tw); dot(px, py, 1.3 + R.flare, col, 0.5 + 0.45 * tw);
      }
      if (R.flare > 0) R.flare = Math.max(0, R.flare - dt * 0.5);
    }
  }
  function drawSparks(dt) {
    for (const s of sparks) { s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.99; const a = Math.max(0, 1 - s.life / s.max); glow(s.x, s.y, s.r * 5, GOLD, 0.35 * a); dot(s.x, s.y, s.r, '#fff3c4', 0.8 * a); }
    sparks = sparks.filter((s) => s.life < s.max);
  }

  let last = 0, raf = 0, idleSpark = 0;
  function frame(ts) {
    raf = 0; if (!on) return;
    const t = ts / 1000, dt = last ? Math.min(0.05, t - last) : 0.016; last = t;
    if (!reduced) { rot += dt * 0.1; idleSpark += dt; if (idleSpark > 4.5) { idleSpark = 0; sparkle(1); } }
    if (wave >= 0) { wave += dt * 0.6; if (wave > 1.2) wave = -1; }
    if (star > 0) star = Math.max(0, star - dt * 0.3);
    for (const g of gifts) { if (g.k < 1) g.k = reduced ? 1 : Math.min(1, g.k + dt * 1.4); if (g.out > 0 && g.out < 1) g.out = Math.min(1, g.out + dt * 0.6); }
    gifts = gifts.filter((g) => g.out < 1);
    cx.clearRect(0, 0, W, H);
    drawGarland(t); drawRings(t, dt); drawTree(t, dt); if (!reduced) drawSparks(dt);
    for (const g of gifts) drawGift(g);
    if (reduced && !star && wave < 0) return; // still: one frame is enough until something happens
    raf = requestAnimationFrame(frame);
  }
  const go = () => { if (on && !raf) raf = requestAnimationFrame(frame); };

  addEventListener('message', (e) => {
    const m = e.data; if (!m || m.bobai !== 'xmas') return;
    if (m.type === 'hello') { reduced = !!m.reduced; place(); go(); }
    else if (m.type === 'layout') { L = m; place(); go(); }
    else if (m.type === 'visible') { on = !!m.on; if (on) { last = 0; go(); } else { cancelAnimationFrame(raf); raf = 0; } }
    else if (m.type === 'event') {
      if (m.kind === 'buy') { addGift(); const dark = LIGHTS.filter((l) => !l.boost); const l = dark[Math.floor(Math.random() * dark.length)]; if (l) l.boost = Math.min(1.3, 0.5 + (m.usd || 0) / 200); if (m.alert) { star = 1; sparkle(8); baubles.forEach((b) => (b.kick = 0.1)); } }
      else if (m.kind === 'burn') { (ring.burnA || (ring.burnA = { flare: 0 })).flare = 1; }
      else if (m.kind === 'liq') { (ring.liq || (ring.liq = { flare: 0 })).flare = 1; wave = 0; }
      go();
    } else if (m.type === 'moment') { star = 1; sparkle(8); baubles.forEach((b) => (b.kick = 0.1)); go(); }
  });
  addEventListener('resize', () => { place(); go(); });
  document.addEventListener('visibilitychange', () => { on = !document.hidden; if (on) { last = 0; go(); } else { cancelAnimationFrame(raf); raf = 0; } });
  place(); go();
})();
</script>
