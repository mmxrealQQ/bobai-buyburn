<style>
html,body{background:#07060a}
#c{position:absolute;inset:0;width:100%;height:100%}
.v{position:absolute;inset:0;background:radial-gradient(40% 36% at 50% 48%,rgba(7,6,10,.84),rgba(7,6,10,.5) 60%,transparent 100%)}
.t{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;pointer-events:none}
.k{display:inline-flex;align-items:center;gap:.45em;padding:2px 9px;border-radius:99px;border:1px solid rgba(255,213,79,.45);background:rgba(240,185,11,.08);font:800 clamp(7px,2.3vw,10px) ui-monospace,monospace;letter-spacing:.2em;color:#ffd54f}
.k i{width:.55em;height:.55em;border-radius:50%;background:#35e07a;box-shadow:0 0 8px #35e07a;animation:bl 1.6s ease-in-out infinite}

.b{display:block;margin-top:.1em;font-size:clamp(22px,13vw,64px);font-weight:900;letter-spacing:-.035em;line-height:1;
  background:linear-gradient(100deg,#b8860b 0%,#ffd54f 30%,#fff6cf 45%,#ffd54f 60%,#c68f76 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(240,185,11,.45));animation:sh 4.5s linear infinite}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-130% 0}}
.s{display:block;margin-top:.3em;font-size:clamp(9px,3.6vw,15px);font-weight:700;color:#fff}
/* the live strip: numbers the page hands in (price, 24 h, burned, market cap) — hidden until they arrive */
.lv{display:flex;justify-content:center;flex-wrap:wrap;gap:.3em .5em;margin:.5em auto 0;max-width:94%;font:700 clamp(8px,3vw,12.5px) ui-monospace,monospace;color:#f3ece6;opacity:0;transition:opacity .6s}
.lv.on{opacity:1}
.lv span{padding:.18em .55em;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,213,79,.18)}
.lv .up{color:#4dff94}.lv .dn{color:#ff7a90}.lv .fire{color:#ff9a3d}
/* the sticker: signed with a Binance Agentic Wallet — it works */
.st{display:inline-flex;align-items:center;gap:.4em;margin-top:.6em;padding:.3em .75em .3em .4em;border-radius:99px;background:linear-gradient(180deg,#2b2410,#17130a);border:1px solid #f0b90b;color:#ffe08a;font:800 clamp(7px,2.5vw,10.5px) system-ui,sans-serif;letter-spacing:.04em;transform:rotate(-2deg);box-shadow:0 0 16px rgba(240,185,11,.3)}
.st svg{width:1.5em;height:1.5em;flex:none}
.p{display:inline-block;margin-top:.6em;padding:.42em 1.1em;border-radius:99px;background:linear-gradient(180deg,#ffe08a,#f0b90b);color:#120e05;font:900 clamp(8px,2.8vw,12px) system-ui,sans-serif;letter-spacing:.12em;
  box-shadow:0 0 0 0 rgba(240,185,11,.6);animation:pu 2.2s ease-out infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(240,185,11,.55)}70%{box-shadow:0 0 0 12px rgba(240,185,11,0)}100%{box-shadow:0 0 0 0 rgba(240,185,11,0)}}
.ca{display:block;margin-top:.5em;font:600 clamp(7px,2.2vw,9.5px) ui-monospace,monospace;letter-spacing:.08em;color:rgba(232,221,211,.6)}
</style>
<canvas id="c"></canvas><div class="v"></div>
<div class="t">
  <span class="k"><i></i>LIVE &middot; THE BRAIN OF BNB CHAIN</span>
  <b class="b">$BOBAI</b>
  <span class="s">Hold the brain. Own the wall.</span>
  <div class="lv" id="lv"><span id="lp">$&ndash;</span><span id="lc">&ndash;</span><span class="fire" id="lb">&ndash; burned</span><span id="lm">MC &ndash;</span></div>
  <span class="st"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="18" width="38" height="28" rx="6" fill="#17130a" stroke="#f0b90b" stroke-width="4"/><path d="M10 26h38" stroke="#f0b90b" stroke-width="3"/><circle cx="46" cy="44" r="12" fill="#35e07a"/><path d="M40 44l4 4 8-8" fill="none" stroke="#0b0a06" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Binance Agentic Wallet &#10003; sign the wall</span><br>
  <span class="p">BUY $BOBAI</span>
  <span class="ca">CA 0x245c&hellip;ffff &middot; BNB CHAIN</span>
</div>
<script>
// a brain of golden synapses with sparks running along them, drawn here; the sandbox fetches nothing and stores nothing:
// the live numbers come from the page that shows this ad ({ wall: 1, live: { bobai: … } }), read by it from BNB Chain
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, N = [], E = [], S = [], heat = 0;
function size() {
  W = c.width = innerWidth * 2; H = c.height = innerHeight * 2; N = []; E = []; S = []; let s = 49467; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 64; i++) { const side = i % 2 ? 1 : -1, a = r() * 6.283, d = Math.sqrt(r()); N.push({ x: W / 2 + side * W * .2 + Math.cos(a) * d * W * .2, y: H / 2 + Math.sin(a) * d * H * .4, p: r() * 6.283, v: .4 + r() }); }
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) { const d = Math.hypot(N[i].x - N[j].x, N[i].y - N[j].y); if (d < Math.min(W, H * 1.6) * .17) E.push([i, j, d]); }
  for (let i = 0; i < 22; i++) S.push({ e: Math.floor(r() * E.length), t: r(), v: .25 + r() * .5 });
}
size(); addEventListener('resize', size);
function f(t) {
  if (c.width !== innerWidth * 2 || c.height !== innerHeight * 2) size();
  t /= 1000; x.clearRect(0, 0, W, H);
  const L = Math.min(W, H * 1.6) * .17, sp0 = 1 + heat;   /* the brain runs warmer when the price is up today */
  for (const [i, j, d] of E) { const a = N[i], b = N[j], k = .45 + .55 * Math.sin(t * 1.3 * sp0 + a.p + b.p); x.strokeStyle = `rgba(240,185,11,${(1 - d / L) * .3 * k})`; x.lineWidth = 2; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
  for (const n of N) { const k = .5 + .5 * Math.sin(t * n.v * 2 * sp0 + n.p); x.fillStyle = `rgba(255,213,79,${.3 + .6 * k})`; x.beginPath(); x.arc(n.x, n.y, 2 + 3 * k, 0, 6.283); x.fill(); }
  for (const sp of S) { sp.t += sp.v * sp0 / 60; if (sp.t > 1) { sp.t = 0; sp.e = (sp.e * 7 + 13) % E.length; } const [i, j] = E[sp.e] || [0, 0], a = N[i], b = N[j]; if (!a || !b) continue;
    const px = a.x + (b.x - a.x) * sp.t, py = a.y + (b.y - a.y) * sp.t, g = x.createRadialGradient(px, py, 0, px, py, 16);
    g.addColorStop(0, 'rgba(255,246,207,.95)'); g.addColorStop(1, 'rgba(255,213,79,0)'); x.fillStyle = g; x.beginPath(); x.arc(px, py, 16, 0, 6.283); x.fill(); }
  x.strokeStyle = 'rgba(255,213,79,.18)'; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2, H * .08); x.lineTo(W / 2, H * .92); x.stroke();
  requestAnimationFrame(f);
}
requestAnimationFrame(f);
// LIVE: what the host page read from BNB Chain
const $ = (id) => document.getElementById(id);
const usd = (v) => v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? '$' + (v / 1e3).toFixed(1) + 'K' : '$' + v.toFixed(2);
addEventListener('message', (m) => {
  const b = m.data && m.data.wall && m.data.live && m.data.live.bobai; if (!b) return;
  if (b.price_usd > 0) $('lp').textContent = '$' + Number(b.price_usd).toPrecision(3);
  if (b.change_24h_pct != null) { const ch = Number(b.change_24h_pct); $('lc').textContent = (ch >= 0 ? '▲ +' : '▼ ') + ch.toFixed(1) + '% 24h'; $('lc').className = ch >= 0 ? 'up' : 'dn'; heat = Math.max(0, Math.min(1.2, ch / 10)); }
  if (b.burned_pct != null) $('lb').textContent = '🔥 ' + Number(b.burned_pct).toFixed(2) + '% burned';
  if (b.market_cap_usd > 0) $('lm').textContent = 'MC ' + usd(Number(b.market_cap_usd));
  $('lv').classList.add('on');
});
</script>
