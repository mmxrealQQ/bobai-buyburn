<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
// quiet snow: few soft flakes, slow, lighter around BOBAI's face; a little more when the market pumps
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, on = true, fig = null, want = 1;
  const F = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const flake = (top) => ({ x: rnd(0, W), y: top ? rnd(-H, 0) : rnd(0, H), r: rnd(0.8, 2.4), vy: rnd(10, 26), ph: rnd(0, 6.28), sw: rnd(6, 18), a: rnd(0.35, 0.8) });
  function size() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 1.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W < 600 ? 34 : 70) * want);
    while (F.length < n) F.push(flake(false)); F.length = n;
  }
  let last = 0, raf = 0;
  function frame(ts) {
    if (!on) return;
    const t = ts / 1000, dt = last ? Math.min(0.05, t - last) : 0.016; last = t;
    cx.clearRect(0, 0, W, H);
    for (const f of F) {
      if (!reduced) { f.y += f.vy * dt; if (f.y > H + 4) Object.assign(f, flake(true), { y: -4 }); }
      const x = f.x + (reduced ? 0 : Math.sin(t * 0.6 + f.ph) * f.sw);
      let a = f.a;
      if (fig && x > fig.x && x < fig.x + fig.w && f.y > fig.y && f.y < fig.y + fig.h * 0.45) a *= 0.25; // clear of the face
      cx.globalAlpha = a; cx.fillStyle = '#fff';
      cx.beginPath(); cx.arc(x, f.y, f.r, 0, 6.283); cx.fill();
      if (f.r > 1.8) { cx.globalAlpha = a * 0.25; cx.beginPath(); cx.arc(x, f.y, f.r * 2.4, 0, 6.283); cx.fill(); }
    }
    cx.globalAlpha = 1;
    if (reduced) { raf = 0; return; }
    raf = requestAnimationFrame(frame);
  }
  const go = () => { if (on && !raf) raf = requestAnimationFrame(frame); };
  addEventListener('message', (e) => {
    const m = e.data; if (!m || m.bobai !== 'xmas') return;
    if (m.type === 'hello') { reduced = !!m.reduced; size(); go(); }
    else if (m.type === 'layout') { fig = m.figure || null; size(); go(); }
    else if (m.type === 'mood') { want = m.mood === 'pump' ? 1.5 : m.mood === 'up' ? 1.2 : 1; size(); go(); }
    else if (m.type === 'visible') { on = !!m.on; if (on) { last = 0; go(); } else { cancelAnimationFrame(raf); raf = 0; } }
  });
  addEventListener('resize', () => { size(); go(); });
  document.addEventListener('visibilitychange', () => { on = !document.hidden; if (on) { last = 0; go(); } else { cancelAnimationFrame(raf); raf = 0; } });
  size(); go();
})();
</script>
</body></html>
