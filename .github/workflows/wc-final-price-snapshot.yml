name: WC26 Final Kickoff Price Snapshot (one-off)

# Cloud backup for the local Task-Scheduler run: freeze BTC/BNB/BOBAI prices
# at the exact WC26 Final kickoff (2026-07-19 19:00:00 UTC) for wc_crypto
# resolution. The script itself waits until exactly 19:00 UTC, so the cron
# fires early on purpose (GitHub cron can lag several minutes).
# Delete this workflow after the crypto pot is resolved.

on:
  schedule:
    - cron: '20 18 19 7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture kickoff prices (waits until 19:00:00 UTC)
        env:
          WC_PRICE_OUT: wc-final-kickoff-prices-gh.json
        run: node wc-final-price-capture.js

      - name: Commit frozen prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wc-final-kickoff-prices-gh.json
          git commit -m "WC26 Final kickoff price freeze (BTC/BNB/BOBAI @ 2026-07-19T19:00:00Z) for wc_crypto resolution"
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 5
          done
