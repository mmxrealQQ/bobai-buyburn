<div class="t"><b>$BOBAI</b><span>31 free tools for AI agents on BNB Chain</span><i>MCP &middot; A2A &middot; LLMS.TXT</i></div>
<script>
// a brain of golden synapses, drawn here; nothing is fetched, nothing is stored
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, N = [];
function size() { W = c.width = innerWidth * 2; H = c.height = innerHeight * 2; N = []; let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 46; i++) { const a = r() * 6.283, d = Math.sqrt(r()); N.push({ x: W / 2 + Math.cos(a) * d * W * .46, y: H / 2 + Math.sin(a) * d * H * .42, p: r() * 6.283, v: .4 + r() }); } }
size(); addEventListener('resize', size);
function f(t) { t /= 1000; x.clearRect(0, 0, W, H);
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) { const a = N[i], b = N[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < W * .2) { const k = .5 + .5 * Math.sin(t * 1.4 + a.p + b.p); x.strokeStyle = `rgba(240,185,11,${(1 - d / (W * .2)) * .32 * k})`; x.lineWidth = 2; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); } }
  for (const n of N) { const k = .5 + .5 * Math.sin(t * n.v * 2 + n.p); x.fillStyle = `rgba(255,213,79,${.35 + .65 * k})`; x.beginPath(); x.arc(n.x, n.y, 2.5 + 3 * k, 0, 6.283); x.fill(); }
  requestAnimationFrame(f); }
requestAnimationFrame(f);
</script>
