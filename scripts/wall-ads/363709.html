<style>
html,body{background:#0b090a}
#c{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:system-ui,sans-serif;pointer-events:none}
.t b{display:block;font-size:clamp(14px,6vw,26px);font-weight:800;color:#5eead4;text-shadow:0 0 16px rgba(45,212,191,.45)}
.t span{display:block;margin-top:4px;font-size:clamp(9px,3vw,12px);color:#e8ddd3;opacity:.9}
</style>
<canvas id="c"></canvas>
<div class="t"><b>DeFi Agent</b><span>runs its own liquidity on PancakeSwap &middot; every move on BNB Chain</span></div>
<script>
// a price line that wanders inside a liquidity range, drawn here; nothing is fetched, nothing is stored
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H; const P = []; let s = 363709; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
function size() { W = c.width = innerWidth * 2; H = c.height = innerHeight * 2; }
size(); addEventListener('resize', size);
let v = 0, last = 0;
for (let i = 0; i < 160; i++) { v += (r() - .5) * .09 - v * .04; P.push(v); }
function f(t) {
  if (t - last > 60) { last = t; v += (r() - .5) * .09 - v * .04; P.push(v); if (P.length > 160) P.shift(); }
  x.clearRect(0, 0, W, H);
  const top = H * .5, bot = H * .9, mid = (top + bot) / 2, half = (bot - top) / 2;
  x.fillStyle = 'rgba(45,212,191,.08)'; x.fillRect(0, top, W, bot - top);
  x.strokeStyle = 'rgba(45,212,191,.45)'; x.lineWidth = 2; x.setLineDash([10, 8]);
  for (const y of [top, bot]) { x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
  x.setLineDash([]);
  x.strokeStyle = '#ffd54f'; x.lineWidth = 4; x.lineJoin = 'round'; x.beginPath();
  P.forEach((p, i) => { const px = (i / 159) * W, py = mid - Math.max(-1.2, Math.min(1.2, p)) * half; i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
  const p = P[P.length - 1] || 0, inR = Math.abs(p) <= 1, py = mid - Math.max(-1.2, Math.min(1.2, p)) * half;
  x.fillStyle = inR ? '#5eead4' : '#ff7a3d'; x.beginPath(); x.arc(W - 6, py, 9, 0, 6.283); x.fill();
  requestAnimationFrame(f);
}
requestAnimationFrame(f);
</script>
