<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Auth gate — hide page + redirect anonymous visitors before first paint -->
  <style>html.wc-gate{visibility:hidden!important}</style>
  <script>
    (function(){
      document.documentElement.classList.add('wc-gate');
      function hasSession(){
        try {
          return Object.keys(localStorage).some(function(k){
            return k.indexOf('sb-')===0 && k.lastIndexOf('-auth-token')===k.length-11 && !!localStorage.getItem(k);
          });
        } catch(e){ return true; }
      }
      if (!hasSession()){ window.location.replace('/worldcup/'); return; }
      document.documentElement.classList.remove('wc-gate');
      window.addEventListener('pageshow', function(e){
        if (e.persisted && !hasSession()) window.location.replace('/worldcup/');
      });
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOBAI Worldcup '26 — Leaderboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png?v=4">
  <link rel="stylesheet" href="./assets/style.css?v=17">
  <style>
    .container.wide{max-width:920px}

    /* TABS */
    .lbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:rgba(0,0,0,.3);padding:5px;border-radius:10px}
    .lbar button{flex:1;min-width:80px;padding:9px 8px;font-size:12px;font-weight:600;border:none;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;transition:all .15s;font-family:inherit}
    .lbar button.active{background:var(--gold-glow);color:var(--gold)}

    /* WALLET FILTER (skip+promote payout view toggle) */
    .wallet-filter{display:flex;gap:5px;flex-wrap:wrap;margin:-4px 0 14px}
    .wallet-filter button{padding:6px 11px;font-size:11px;font-weight:600;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--muted);border-radius:7px;cursor:pointer;transition:all .15s;font-family:inherit;letter-spacing:.3px}
    .wallet-filter button:hover{border-color:rgba(240,185,11,.3)}
    .wallet-filter button.active{background:var(--gold-glow);color:var(--gold);border-color:var(--gold)}

    /* GROUP/COIN SELECTOR */
    .sub-selector{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
    .sub-selector button{padding:7px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--muted);border-radius:7px;cursor:pointer;transition:all .15s;font-family:inherit;letter-spacing:.5px;display:inline-flex;align-items:center;gap:6px}
    .sub-selector button:hover{border-color:rgba(240,185,11,.3)}
    .sub-selector button.active{background:var(--gold-glow);color:var(--gold);border-color:var(--gold)}
    .sub-selector button .coin-ic{width:16px;height:16px;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle;overflow:hidden}
    .coin-badge{width:18px;height:18px;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:-4px;margin-right:6px;overflow:hidden}
    .coin-ic.bobai,.coin-badge.bobai{transform:scale(1.08)} /* match BTC/BNB optical size — see crypto.html note */

    /* LIST */
    .list{display:flex;flex-direction:column;gap:6px}
    .list.scroll-cap{max-height:600px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(240,185,11,.3) transparent}
    .list.scroll-cap::-webkit-scrollbar{width:6px}
    .list.scroll-cap::-webkit-scrollbar-thumb{background:rgba(240,185,11,.25);border-radius:3px}
    .row{display:grid;grid-template-columns:38px 30px 1fr minmax(82px,108px) auto;gap:10px;align-items:center;padding:12px 14px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;transition:all .15s}
    .row.me{border-color:var(--gold);background:rgba(240,185,11,.07)}
    .row.top1{background:linear-gradient(90deg,rgba(240,185,11,.15),rgba(0,0,0,.25));border-color:rgba(240,185,11,.4)}
    .row.top2{background:linear-gradient(90deg,rgba(192,192,192,.08),rgba(0,0,0,.25));border-color:rgba(192,192,192,.25)}
    .row.top3{background:linear-gradient(90deg,rgba(205,127,50,.08),rgba(0,0,0,.25));border-color:rgba(205,127,50,.25)}
    .row.closest{background:linear-gradient(90deg,rgba(240,185,11,.18),rgba(240,185,11,.06));border-color:var(--gold);box-shadow:0 0 24px rgba(240,185,11,.12)}
    /* Paid-out group winner — green tint overrides medal styling so the row
       reads as "money already left the pool" rather than "currently leading". */
    .row.paid{background:linear-gradient(90deg,rgba(0,230,118,.10),rgba(0,230,118,.03));border-color:rgba(0,230,118,.42);position:relative}
    .row.paid::after{content:'✓ paid';position:absolute;top:6px;right:8px;font-family:'Space Grotesk';font-size:9px;letter-spacing:.8px;color:#7fffb0;background:rgba(0,230,118,.14);border:1px solid rgba(0,230,118,.3);padding:1px 6px;border-radius:4px;font-weight:700;text-transform:uppercase;pointer-events:none}
    .row.paid.me{border-color:rgba(0,230,118,.55);background:linear-gradient(90deg,rgba(0,230,118,.16),rgba(240,185,11,.04))}
    /* Forfeit (cap-hit at 0 BOBAI balance): share cascaded to others */
    .row.forfeit{background:linear-gradient(90deg,rgba(255,180,0,.07),rgba(0,0,0,.25));border-color:rgba(255,180,0,.32);opacity:.85}
    .row.forfeit::after{content:'26× cap';position:absolute;top:6px;right:8px;font-family:'Space Grotesk';font-size:9px;letter-spacing:.8px;color:#ffc066;background:rgba(255,180,0,.14);border:1px solid rgba(255,180,0,.32);padding:1px 6px;border-radius:4px;font-weight:700;text-transform:uppercase;pointer-events:none}
    .row.forfeit .prize-cell .pz-pct,.row.forfeit .prize-cell .pz-bobai,.row.forfeit .prize-cell .pz-usd{color:rgba(255,192,102,.7)}
    .forfeit-pill{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:5px;background:rgba(255,180,0,.12);border:1px solid rgba(255,180,0,.32);color:#ffc066;font-family:'Space Grotesk';font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;cursor:help}

    .rank{font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--muted);text-align:center}
    .row.top1 .rank{color:var(--gold);font-size:18px}
    .row.top2 .rank{color:#cccccc;font-size:16px}
    .row.top3 .rank{color:#cd7f32;font-size:16px}
    .row.closest .rank{color:var(--gold);font-size:18px}
    .ava-sm{display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
    .uinfo{min-width:0}
    .uname{font-weight:600;color:var(--text);font-size:14px;display:flex;align-items:center;gap:4px;min-width:0}
    .uname .uname-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .uname .ball{font-size:13px;flex-shrink:0}
    .umeta{font-size:11px;color:var(--muted)}
    /* Tie-breaker pill — shown when this row beat its tied-on-points neighbor on BOBAI balance.
       Actual amounts are NEVER exposed; the server returns just a `bobai_beats_below` flag. */
    .tie-pill{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px;background:rgba(240,185,11,.12);border:1px solid rgba(240,185,11,.32);color:var(--gold);font-family:'Space Grotesk';font-weight:600;font-size:9.5px;letter-spacing:.4px;border-radius:99px;text-transform:none;white-space:nowrap;vertical-align:1px}
    .pts{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--gold);white-space:nowrap;text-align:right}
    .pts .lbl{font-size:9.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-left:4px;font-weight:500}
    .pts.diff{font-size:14px;color:var(--text)}

    /* Prize cell — between username and pts */
    .prize-cell{text-align:right;font-family:'Space Grotesk';line-height:1.1;min-width:0}
    .prize-cell .pz-pct{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.3px}
    .prize-cell .pz-bobai{font-size:10.5px;color:var(--text);font-weight:600;margin-top:1px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .prize-cell .pz-usd{font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
    .prize-cell.zero .pz-pct{color:var(--muted);font-weight:600}
    .prize-cell.zero .pz-bobai,.prize-cell.zero .pz-usd{color:rgba(123,125,158,.55)}

    /* Rank gap (between top-N and "your row") */
    .rank-gap{text-align:center;color:var(--muted);padding:6px;letter-spacing:6px;font-weight:700;opacity:.5}

    /* "Your rank" footer */
    .me-footer{margin-top:14px;padding:12px 16px;background:linear-gradient(90deg,rgba(240,185,11,.08),rgba(240,185,11,.02));border:1px solid rgba(240,185,11,.3);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
    .me-footer .mf-left{display:flex;align-items:center;gap:10px;color:var(--text)}
    .me-footer .mf-rank{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--gold)}
    .me-footer .mf-status{color:var(--muted)}
    .me-footer .mf-status.qualified{color:#5fffa0;font-weight:600}
    .me-footer .mf-status.need{color:#ffc066;font-weight:600}

    /* Bracket-as-list (one phase shown at a time) */
    .br-list{display:flex;flex-direction:column;gap:8px}
    .br-list .br-match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 16px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px}
    .br-list .br-match.played{border-color:rgba(240,185,11,.25)}
    .br-list .br-match.final{border-color:var(--gold);background:rgba(240,185,11,.06)}
    .br-list .br-team{display:flex;align-items:center;gap:8px;min-width:0}
    .br-list .br-team.away{justify-content:flex-end}
    .br-list .br-team .fl{font-size:20px;flex-shrink:0}
    .br-list .br-team .nm{color:var(--text);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .br-list .br-team.tbd .nm{color:var(--muted)}
    .br-list .br-team.win .nm{font-weight:700;color:var(--gold)}
    .br-list .br-center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
    .br-list .br-score{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--text)}
    .br-list .br-score.played{color:var(--gold)}
    .br-list .br-pens{font-family:'Space Grotesk';font-weight:600;font-size:11px;color:var(--muted);white-space:nowrap}
    .br-list .br-vs{font-size:11px;color:var(--muted);letter-spacing:1px}
    .br-list .br-time{font-size:10px;color:var(--muted);margin-top:2px}

    /* Crypto stack — closest in middle */
    .crypto-divider{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--muted);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
    .crypto-divider::before,.crypto-divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .crypto-divider.up{color:#5fffa0}
    .crypto-divider.up::before,.crypto-divider.up::after{background:rgba(0,230,118,.2)}
    .crypto-divider.down{color:#ff8580}
    .crypto-divider.down::before,.crypto-divider.down::after{background:rgba(255,80,80,.2)}

    .empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;background:rgba(0,0,0,.2);border:1px dashed var(--border);border-radius:10px}

    /* FIFA STANDINGS TABLE */
    .section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 4px 8px;font-family:'Space Grotesk';font-weight:600;font-size:11.5px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
    .section-h .right{color:var(--muted);font-weight:500;letter-spacing:.5px;text-transform:none;font-size:11px}
    /* Settled (group pot paid & frozen) explainer + receipt-order divider */
    .settled-pill{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:5px;background:rgba(0,230,118,.14);border:1px solid rgba(0,230,118,.32);color:#7fffb0;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;vertical-align:1px}
    .settled-note{margin:0 4px 12px;padding:10px 13px;background:rgba(0,230,118,.05);border:1px solid rgba(0,230,118,.18);border-radius:9px;color:var(--muted);font-size:11.5px;line-height:1.55}
    .settled-note b{color:#7fffb0;font-weight:700}
    .settled-divider{text-align:center;font-size:9.5px;letter-spacing:.6px;color:var(--muted);opacity:.65;margin:8px 0 4px;text-transform:uppercase;font-family:'Space Grotesk';font-weight:600}
    .standings{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:6px}
    .standings table{width:100%;border-collapse:collapse;font-size:13px}
    .standings th,.standings td{padding:9px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
    .standings th{font-family:'Space Grotesk';font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;background:rgba(0,0,0,.4)}
    .standings tbody tr:last-child td{border-bottom:none}
    .standings .team-cell{text-align:left;padding-left:10px;display:flex;align-items:center;gap:8px;min-width:0}
    .standings .team-cell .fl{font-size:18px;line-height:1;flex-shrink:0}
    .standings .team-cell .nm{color:var(--text);font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .standings .pos{font-weight:700;color:var(--muted);width:24px}
    .standings .pts{color:var(--gold);font-weight:700;font-family:'Space Grotesk'}
    .standings .gd-pos{color:#5fffa0}
    .standings .gd-neg{color:#ff7a7a}
    .standings tr.q1,.standings tr.q2{background:rgba(240,185,11,.04)}
    .standings tr.q1 .pos,.standings tr.q2 .pos{color:var(--gold)}
    .standings tr.q3{background:rgba(123,125,158,.04)}
    .standings .q-note{font-size:10px;color:var(--muted);padding:8px 12px;background:rgba(0,0,0,.4);text-align:left;border-top:1px solid rgba(255,255,255,.04)}

    /* BONUS VIEW */
    .bonus-intro{padding:11px 14px;background:rgba(240,185,11,.04);border:1px solid rgba(240,185,11,.18);border-radius:10px;color:var(--text);font-size:12px;line-height:1.55;margin-bottom:14px}
    .bonus-intro b{color:var(--gold)}
    .bonus-status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 4px 8px}
    .bonus-status .left{font-family:'Space Grotesk';font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
    .bonus-status .right{font-size:11px;color:var(--muted);font-weight:500}
    .bonus-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-family:'Space Grotesk';font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
    .bonus-pill.pending{background:rgba(123,125,158,.12);color:var(--muted)}
    .bonus-pill.live{background:rgba(64,160,255,.12);color:#80b8ff}
    .bonus-pill.locked{background:rgba(240,185,11,.16);color:var(--gold)}

    .bonus-card{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
    .bonus-card.eliminated{opacity:.45}
    .bonus-card.winner{border-color:var(--gold);background:linear-gradient(135deg,rgba(240,185,11,.06),rgba(0,0,0,.3))}
    .bonus-card .bc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .bonus-card .bc-ava{font-size:30px;line-height:1;flex-shrink:0}
    .bonus-card .bc-info{flex:1;min-width:0}
    .bonus-card .bc-name{font-weight:600;color:var(--text);font-size:14px;line-height:1.2}
    .bonus-card .bc-name .country{color:var(--muted);font-weight:500;font-size:12px;margin-left:5px}
    .bonus-card .bc-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .bonus-card .bc-meta b{color:var(--gold);font-family:'Space Grotesk';font-weight:700}
    .bonus-card .bc-meta .elim{color:#ff9080}
    .bonus-card .bc-tippers{display:flex;flex-wrap:wrap;gap:5px}
    .bonus-card .bc-tippers .empty{padding:6px 10px;font-size:11.5px;color:var(--muted);font-style:italic;background:transparent;border:1px dashed var(--border);border-radius:6px}
    .bonus-card .tip-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:99px;font-size:11.5px;color:var(--text);text-decoration:none;transition:all .12s}
    .bonus-card .tip-chip:hover{border-color:var(--gold);color:var(--gold)}
    .bonus-card .tip-chip.me{border-color:var(--gold);background:rgba(240,185,11,.1);color:var(--gold);font-weight:700}
    .bonus-card .tip-chip .pts-tag{font-family:'Space Grotesk';font-weight:700;font-size:10px;padding:1px 5px;border-radius:99px;letter-spacing:.5px}
    .bonus-card .tip-chip .pts-tag.pending{background:rgba(123,125,158,.18);color:var(--muted)}
    .bonus-card .tip-chip .pts-tag.awarded{background:rgba(95,255,160,.18);color:#5fffa0}
    .bonus-card .ball{font-size:11px}

    .bonus-empty{padding:18px;text-align:center;color:var(--muted);font-size:12.5px;background:rgba(0,0,0,.18);border:1px dashed var(--border);border-radius:10px}

    /* KO BRACKET */
    .bracket-wrap{overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
    .bracket{display:flex;gap:14px;min-width:max-content}
    .br-col{display:flex;flex-direction:column;gap:10px;min-width:170px}
    .br-col-h{font-family:'Space Grotesk';font-weight:600;font-size:11px;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;text-align:center;padding-bottom:4px;border-bottom:1px solid var(--border)}
    .br-match{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.4;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:62px}
    .br-match.played{border-color:rgba(240,185,11,.25)}
    .br-match.final{border-color:var(--gold);background:rgba(240,185,11,.06)}
    .br-team{display:flex;align-items:center;gap:6px;min-width:0}
    .br-team .fl{font-size:14px;flex-shrink:0}
    .br-team .nm{flex:1;min-width:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .br-team.tbd .nm{color:var(--muted)}
    .br-team.win .nm{font-weight:700;color:var(--gold)}
    .br-team .sc{font-family:'Space Grotesk';font-weight:700;color:var(--text);font-size:12.5px;min-width:14px;text-align:right}
    .br-team.win .sc{color:var(--gold)}
    .br-meta{font-size:9.5px;color:var(--muted);letter-spacing:.4px;margin-top:5px;text-align:right}

    @media (max-width: 560px){
      .row{grid-template-columns:28px 26px 1fr minmax(70px,84px) auto;gap:7px;padding:10px 10px}
      .uname{font-size:13px}
      .pts{font-size:15px}
      .prize-cell .pz-pct{font-size:12px}
      .prize-cell .pz-bobai{font-size:9.5px}
      .prize-cell .pz-usd{font-size:9px}
      .standings th,.standings td{padding:7px 4px;font-size:12px}
      .standings .team-cell .nm{font-size:11.5px}
      .standings .team-cell{padding-left:6px;gap:5px}
      .standings .team-cell .fl{font-size:15px}
      .br-col{min-width:150px}
      .br-list .br-match{grid-template-columns:1fr auto 1fr;padding:10px 12px;gap:8px}
      .br-list .br-team .nm{font-size:12px}
      .br-list .br-center{min-width:54px}
      .br-list .br-score{font-size:16px}
      .me-footer{padding:10px 12px;font-size:12px}
      .me-footer .mf-rank{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="bg-grad"></div>
  <div class="page">
    <nav>
      <div class="nav">
        <a class="back-btn" href="/" title="Back to Dashboard"><span>&larr;</span> Dashboard</a>
        <a class="brand-link" href="/worldcup/">BOBAI Worldcup '26</a>
        <div class="user">Hi <b id="me-name">…</b> · <a href="#" id="logout">logout</a></div>
      </div>
      <div class="tabbar">
        <a href="./dashboard.html" data-tab="dashboard"><span class="ic">🏠</span> Dashboard</a>
        <a href="./tips.html" data-tab="tips"><span class="ic">⚽</span> Tips</a>
        <a href="./bonus.html" data-tab="bonus"><span class="ic">🏆</span> Bonus</a>
        <a href="./crypto.html" data-tab="crypto"><span class="ic">📈</span> Crypto</a>
        <a href="./leaderboard.html" data-tab="leaderboard"><span class="ic">📊</span> Leaderboard</a>
        <a href="./prize-pool.html" data-tab="prize-pool"><span class="ic">💰</span> Prize Pool</a>
        <a href="./rules.html" data-tab="rules"><span class="ic">📖</span> Rules</a>
      </div>
    </nav>

    <main>
      <div class="container wide">

          <div data-card-accent="pool-trophy"></div>
          <h1><span class="accent">Leaderboard</span></h1>
          <p class="sub">Live shares update with the <a href="./prize-pool.html" style="color:var(--gold)">prize pool</a> · ⚽ = wallet linked · only wallet-linked players are eligible for payouts (next eligible player takes the slot)</p>

          <!-- WALLET FILTER (toggles between full leaderboard and the exact payout ranking) -->
          <div class="wallet-filter" id="wallet-filter">
            <button data-filter="all" class="active">All players</button>
            <button data-filter="wallet">💰 Wallet-linked only</button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./assets/config.js?v=12"></script>
  <script src="./assets/countries.js?v=11"></script>
  <script src="./assets/auth.js?v=13"></script>
  <script src="./assets/profile.js?v=17"></script>
  <script src="./assets/projection.js?v=4"></script>
  <script src="./assets/avatar.js?v=7"></script>
  <script src="./assets/nav.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>
  <script src="./assets/twemojify.js?v=2"></script>
  <script>
    const $ = (s,r=document)=>r.querySelector(s);
    const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

    // ============== CONSTANTS ==============
    const POOL_SPLIT = {
      groupTop1:  0.55,  // 1st-of-each-group bracket (split flat across GROUP_SLOTS_TOP1=12)
      groupTop2:  0.30,  // 2nd-of-each-group bracket (split flat across GROUP_SLOTS_TOP2=12)
      groupBest3: 0.15,  // 8 best 3rd-placed players (split flat across GROUP_SLOTS_BEST3=8)
      // End-pool: fixed tiered weights for top 4 overall
      endTiers: [0.50, 0.25, 0.15, 0.10],
    };
    // Fixed slot counts — per-player share is always (fraction * group_pot) / slots,
    // regardless of how many slots are actually filled at projection time. This matches
    // the published rules (Group 1st × 12 → 55 %/12 ≈ 4.58 % etc.) and avoids inflating
    // a single early leader to look like they'd win the whole bracket.
    const GROUP_SLOTS_TOP1  = 12;
    const GROUP_SLOTS_TOP2  = 12;
    const GROUP_SLOTS_BEST3 = 8;
    const END_TOP_N = POOL_SPLIT.endTiers.length;
    const GROUP_LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
    const COINS = [
      { code:'btc',   label:'BTC',   icon:'./illus/coin-btc.webp' },
      { code:'bnb',   label:'BNB',   icon:'./illus/coin-bnb.webp' },
      { code:'bobai', label:'BOBAI', icon:'./illus/coin-bobai.webp' },
    ];
    const KO_PHASES = [
      { key:'r32',   label:'Round of 32' },
      { key:'r16',   label:'Round of 16' },
      { key:'qf',    label:'Quarter-finals' },
      { key:'sf',    label:'Semi-finals' },
      { key:'3rd',   label:'Third place' },
      { key:'final', label:'Final' },
    ];
    // Bonus sub-tabs. Champion is first — it's the headline pick.
    const BONUS_TABS = [
      { key:'champion',     label:'🏆 Champion',     field:'champion',
        title:'World Cup winner',
        intro:'Every tipped country stays on the board <b>until that team exits the tournament</b>. Eliminated teams are greyed out. The 20 points lock in <b>green</b> when the lifting-the-trophy team is decided at the end of the final.' },
      { key:'most_goals',   label:'⚽ Most goals',   field:'most_goals_team',
        title:'Team with the most goals scored',
        intro:'Whoever is leading the goals-scored table right now. The 20-point award goes <b>green</b> once the team is mathematically uncatchable.' },
      { key:'fewest_goals', label:'🥅 Fewest goals', field:'fewest_goals_team',
        title:'Team with the fewest goals scored',
        intro:'Live during the group phase. Locks in when the qualifying team is final — usually the lowest-scoring team that exits the tournament.' },
      { key:'golden_boot',  label:'👑 Golden Boot',  field:'topscorer_country',
        title:'Country of the top scorer',
        intro:'Live top-scorer feed (football-data.org). Resolves at the final once the Golden Boot is mathematically locked.' },
      { key:'red_cards',    label:'🟥 Red cards',    field:'red_cards_bracket',
        title:'Total red cards in the tournament',
        intro:'Live counter — only resolves at the <b>end of the final</b>. The bracket the running total currently sits in is highlighted; tippers of that bracket are the candidates to win the 20 points.' },
    ];
    const RED_CARD_BRACKETS = [
      { key:'<5',    label:'< 5',    min: 0,  max: 4  },
      { key:'5-9',   label:'5 – 9',  min: 5,  max: 9  },
      { key:'10-14', label:'10 – 14',min:10,  max:14  },
      { key:'15-19', label:'15 – 19',min:15,  max:19  },
      { key:'>19',   label:'> 19',   min:20,  max: Infinity },
    ];

    // ============== STATE ==============
    let me = null;
    let view = 'overall';
    let subView = null;
    let allMatches = null;
    let pool = { total:0, group:0, end:0, crypto:0, price:0 };
    let allGroupData = null;
    let livePrices = { btc:null, bnb:null, bobai:null };
    // walletOnly: when true, non-linked players are hidden across every view (Overall, Groups,
    // Bracket projection, Crypto) and ranks re-number against the linked-only set — this is
    // the literal payout ranking the admin uses at settlement. Default OFF so the leaderboard
    // still shows bragging-rights positions for non-linked players. Persisted in localStorage.
    let walletOnly = false;
    try { walletOnly = localStorage.getItem('wc_wallet_filter') === '1'; } catch(e){}
    function isEligible(r){ return !!(r && r.has_wallet); }
    function applyWalletFilter(rows){ return walletOnly ? rows.filter(isEligible) : rows; }

    // ============== FORMATTERS ==============
    function countryFlag(code){ const c = window.WC_COUNTRIES.find(x => x.code === code); return c ? c.flag : '⚪'; }
    function countryName(code){ const c = window.WC_COUNTRIES.find(x => x.code === code); return c ? c.name : '—'; }
    function fmtPts(p){
      if (p == null) return '0';
      const n = Number(p);
      if (!Number.isFinite(n)) return '0';
      return Number.isInteger(n) ? String(n) : (+n.toFixed(2)).toString();
    }
    function fmtBobai(n){
      if (n == null) return '0';
      const v = Number(n);
      if (v >= 1_000_000) return (v/1_000_000).toFixed(2) + 'M';
      if (v >= 1_000)     return (v/1_000).toFixed(1) + 'K';
      return v.toFixed(0);
    }
    function fmtUsd(n){
      if (n == null || !isFinite(n)) return '$0.00';
      if (n >= 1_000_000) return '$' + (n/1_000_000).toFixed(2) + 'M';
      if (n >= 1_000)     return '$' + (n/1_000).toFixed(1) + 'K';
      return '$' + n.toFixed(2);
    }
    function fmtCryptoPrice(coin, n){
      if (n == null) return '—';
      const v = Number(n);
      if (coin === 'bobai') return '$' + v.toFixed(10).replace(/0+$/,'').replace(/\.$/,'');
      if (coin === 'btc')   return '$' + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return '$' + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }
    function fmtPct(p){
      if (p == null || !isFinite(p)) return '—';
      if (p === 0) return '0%';
      if (p < 0.01) return '<0.01%';
      if (p < 0.1)  return p.toFixed(2) + '%';
      if (p < 10)   return p.toFixed(1)  + '%';
      return p.toFixed(0) + '%';
    }
    function fmtKickoffShort(iso){
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' · ' +
             d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
    }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]); }
    function coinDisplay(c){ return c === 'bobai' ? 'BOBAI' : c.toUpperCase(); }
    function coinIconPath(c){ const m = COINS.find(x => x.code === c); return m ? m.icon : ''; }

    // ============== PRIZE MATH ==============
    // End-pool: fixed tiered weights (50 / 25 / 15 / 10 %) for top 4 by total_points.
    // Skip+promote: non-linked players are skipped — the next wallet-linked player takes the
    // slot (e.g. if leaderboard #1 has no wallet, the wallet-linked #2 becomes payout #1).
    function computeEndPoolShares(rows){
      const shares = new Map();
      const eligible = rows.filter(isEligible);
      const top = eligible.slice(0, END_TOP_N);
      top.forEach((r, i) => {
        const tier = POOL_SPLIT.endTiers[i] || 0;
        shares.set(r.user_id, tier * pool.end);
      });
      return shares;
    }

    // Group pot: 55/30/15 across {top1, top2, best-3rd}. Per-player share = (fraction *
    // group_pot) / FIXED slots (12/12/8) — NOT divided by actually-filled slots. Empty
    // slots don't inflate the remaining players' projections; any unallocated share is
    // resolved at payout time within the SAME pot (cap-cascade first; if residual remains
    // after every winner is capped, leftover → permanent BOBAI/BNB liquidity + LP burn).
    // Keyed by `${user_id}|${letter}`.
    function computeGroupShares(allGroups){
      const shares = new Map();
      if (pool.group <= 0) return shares;
      const top1s = [], top2s = [], best3candidates = [];
      allGroups.forEach(g => {
        // Skip+promote within each group: drop non-linked players first, then pick top1/top2/best3.
        const r = g.rows.filter(isEligible);
        if (r[0]) top1s.push({ ...r[0], _letter: g.letter });
        if (r[1]) top2s.push({ ...r[1], _letter: g.letter });
        if (r[2]) best3candidates.push({ ...r[2], _letter: g.letter });
      });
      const best3 = best3candidates
        .sort((a,b) => (b.group_points||0) - (a.group_points||0))
        .slice(0, GROUP_SLOTS_BEST3);
      function distribute(bracket, fraction, slots){
        if (!bracket.length || slots <= 0) return;
        const each = (pool.group * fraction) / slots;
        bracket.forEach(r => shares.set(`${r.user_id}|${r._letter}`, each));
      }
      distribute(top1s, POOL_SPLIT.groupTop1,  GROUP_SLOTS_TOP1);
      distribute(top2s, POOL_SPLIT.groupTop2,  GROUP_SLOTS_TOP2);
      distribute(best3, POOL_SPLIT.groupBest3, GROUP_SLOTS_BEST3);
      return shares;
    }

    // Crypto: each coin pot ≈ 3.3% of total (= crypto_pot / 3); winner-take-all
    function computeCryptoWinnerShare(){ return pool.crypto / 3; }

    // ============== UI HELPERS ==============
    // contextPot: the pot this row is paid out of (end / group / crypto). The percentage
    // is the share of THAT pot — so Overall 1st reads 50% (of end pool), Crypto winner 33%
    // (of crypto pot), Group top1 ≈ 4.6% (of group pot, since 12 winners share the 55% bracket).
    function prizeCellHtml(bobai, contextPot){
      const pot = contextPot || 0;
      const pct = pot > 0 ? (bobai / pot * 100) : 0;
      const hasPrice = (pool.price || 0) > 0;
      const usdStr = !(bobai > 0) ? '$0' : (hasPrice ? fmtUsd(bobai * pool.price) : 'n/a');
      const isZero = !(bobai > 0);
      return `<div class="prize-cell ${isZero ? 'zero' : ''}">
        <div class="pz-pct">${isZero ? '—' : fmtPct(pct)}</div>
        <div class="pz-bobai">${isZero ? '0 BOBAI' : fmtBobai(bobai) + ' BOBAI'}</div>
        <div class="pz-usd">${usdStr}</div>
      </div>`;
    }

    function rowClass(rank, userId, extra){
      let c = 'row';
      if (rank === 1) c += ' top1';
      else if (rank === 2) c += ' top2';
      else if (rank === 3) c += ' top3';
      if (me && me.id === userId) c += ' me';
      if (extra) c += ' ' + extra;
      return c;
    }

    function rankLabel(rank){
      if (rank === 1) return '🥇';
      if (rank === 2) return '🥈';
      if (rank === 3) return '🥉';
      return '#' + rank;
    }

    function userRow(r, rank, opts){
      const country = countryName(r.avatar_country);
      const ball = r.has_wallet ? '<span class="ball">⚽</span>' : '';
      const href = './user.html?u=' + encodeURIComponent(r.username);
      const ava = window.WC_AVATAR
        ? window.WC_AVATAR.avatarHtml(r.avatar_country, 'sm')
        : `<span style="font-size:22px">${countryFlag(r.avatar_country)}</span>`;
      const prize = (opts.prizeBobai != null)
        ? prizeCellHtml(opts.prizeBobai, opts.contextPot)
        : `<div class="prize-cell zero"><div class="pz-pct">—</div><div class="pz-bobai">0 BOBAI</div><div class="pz-usd">$0</div></div>`;
      const ptsLabel = opts.ptsLabel ? `<span class="lbl">${opts.ptsLabel}</span>` : '';
      const pts = `<div class="pts ${opts.ptsClass || ''}">${opts.ptsValue}${ptsLabel}</div>`;
      // Tie-breaker badge — only when this row genuinely beat a tied-on-points
      // neighbor on BOBAI balance (server-side flag, no amounts exposed). Limited
      // to paid positions in this view: Groups top 3 (55/30/15), Overall/Bracket
      // top 4 (50/25/15/10). Non-payout ties stay quiet.
      const medalRank = opts.medalRank || 3;
      // Past tense ("held") for settled/frozen views, present ("holds") for live ones.
      const tieVerb = opts.tiePast ? 'held' : 'holds';
      const tiePill = (r.bobai_beats_below && rank <= medalRank)
        ? ` · <span class="tie-pill" title="Tied on points; ranks higher because this wallet ${tieVerb} more $BOBAI (rules §7).">${tieVerb} more $BOBAI</span>`
        : '';
      // Cap-not-reached badge — wallet linked but 26× holder cap = 0 (i.e. holds
      // too little $BOBAI), so the row's share cascades to the other group winners.
      // Shown only after the group pot is paid (opts.forfeit = wc_payouts amount === 0).
      const forfeitPill = opts.forfeit
        ? ` · <span class="forfeit-pill" title="Wallet didn't meet the 26× holder cap — share cascaded to remaining group winners (rules §5).">didn't reach 26× cap</span>`
        : '';
      return `<a href="${href}" class="${rowClass(rank, r.user_id, opts.extraClass)}" style="text-decoration:none;color:inherit">
        <div class="rank">${rankLabel(rank)}</div>
        <div class="ava-sm">${ava}</div>
        <div class="uinfo">
          <div class="uname"><span class="uname-text">${escapeHtml(r.username)}</span>${ball}</div>
          <div class="umeta">${country}${tiePill}${forfeitPill}</div>
        </div>
        ${prize}
        ${pts}
      </a>`;
    }

    function meFooterHtml({ rank, totalRows, qualifierRank, qualifierPts, myPts, qualifiedCopy, needCopy }){
      if (!me) {
        return `<div class="me-footer"><div class="mf-left"><span class="mf-status">Sign in to see your own rank here.</span></div></div>`;
      }
      if (rank == null) {
        return `<div class="me-footer"><div class="mf-left"><span class="mf-status">You don't have entries in this view yet.</span></div></div>`;
      }
      const qualified = rank <= qualifierRank;
      const need = Math.max(1, Math.ceil((qualifierPts || 0) - (myPts || 0) + 0.01));
      const statusHtml = qualified
        ? `<span class="mf-status qualified">${qualifiedCopy}</span>`
        : `<span class="mf-status need">${needCopy.replace('{n}', need)}</span>`;
      return `<div class="me-footer">
        <div class="mf-left">
          <span class="mf-rank">#${rank}</span>
          <span class="mf-status">of ${totalRows} player${totalRows===1?'':'s'}</span>
        </div>
        <div>${statusHtml}</div>
      </div>`;
    }

    // ============== POOL ==============
    async function loadPool(){
      const r = await window.WC_PROFILE.loadPool();
      if (r.error) return;
      const p = r.pool || {};
      pool = {
        total:        parseFloat(p.total_bobai)     || 0,
        group:        parseFloat(p.group_pot)       || 0,
        end:          parseFloat(p.endpool)         || 0,
        crypto:       parseFloat(p.crypto_pot)      || 0,
        price:        parseFloat(p.bobai_price_usd) || 0,
        groupPaidAt:  p.group_paid_at || null,
      };
    }

    // ============== MATCHES + FIFA STANDINGS ==============
    async function loadAllMatches(){
      if (allMatches) return allMatches;
      const r = await window.WC_PROFILE.loadMatches();
      allMatches = r.matches || [];
      return allMatches;
    }

    // --- Knockout result helpers (extra time / penalties) ---
    // goals_home/away = 90-min result (what tips are scored on).
    // final_home/away (+ decided_by 'aet'|'pens') = full result that decides who
    // advances. Winner = direction of final when present, else of goals.
    function matchWinnerSide(m){
      const hasFinal = m.final_home != null && m.final_away != null;
      const h = hasFinal ? m.final_home : m.goals_home;
      const a = hasFinal ? m.final_away : m.goals_away;
      if (h == null || a == null || h === a) return null;
      return h > a ? 'home' : 'away';
    }
    // Goals counted toward scorer tallies: extra-time goals count, penalties never.
    function statGoals(m){
      if (m.decided_by === 'aet' && m.final_home != null)
        return { h: m.final_home, a: m.final_away };
      return { h: m.goals_home, a: m.goals_away };
    }
    // Scoreline suffix: "(3:4 pen)" or "(2:1 a.e.t.)". Empty for regular results.
    function resultSuffix(m){
      if (m.decided_by === 'pens' && m.final_home != null)
        return ` <span class="br-pens">(${m.final_home - m.goals_home}:${m.final_away - m.goals_away} pen)</span>`;
      if (m.decided_by === 'aet' && m.final_home != null)
        return ` <span class="br-pens">(${m.final_home}:${m.final_away} a.e.t.)</span>`;
      return '';
    }

    function computeStandings(matches, groupLetter){
      const teams = {};
      const gm = matches.filter(m => m.phase === 'group' && m.group_letter === groupLetter);
      gm.forEach(m => {
        [m.team_home, m.team_away].forEach(t => {
          if (t && t !== 'TBD' && !teams[t]) teams[t] = { code:t, P:0, W:0, D:0, L:0, GF:0, GA:0, GD:0, Pts:0 };
        });
        if (!m.played || m.goals_home == null || m.goals_away == null) return;
        const H = teams[m.team_home], A = teams[m.team_away];
        if (!H || !A) return;
        H.P++; A.P++;
        H.GF += m.goals_home; H.GA += m.goals_away;
        A.GF += m.goals_away; A.GA += m.goals_home;
        H.GD = H.GF - H.GA; A.GD = A.GF - A.GA;
        if (m.goals_home > m.goals_away)      { H.W++; H.Pts += 3; A.L++; }
        else if (m.goals_home < m.goals_away) { A.W++; A.Pts += 3; H.L++; }
        else                                  { H.D++; A.D++; H.Pts++; A.Pts++; }
      });
      return Object.values(teams).sort((a,b) =>
        b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF || a.code.localeCompare(b.code)
      );
    }

    function renderStandingsTable(rows, letter){
      if (!rows.length) return `<div class="empty">Group ${letter} teams not seeded yet.</div>`;
      const head = `<tr><th class="pos">#</th><th class="team-cell" style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF:GA</th><th>GD</th><th>Pts</th></tr>`;
      const body = rows.map((t, i) => {
        const rank = i + 1;
        const cls = rank <= 2 ? 'q'+rank : (rank === 3 ? 'q3' : '');
        const gdCls = t.GD > 0 ? 'gd-pos' : (t.GD < 0 ? 'gd-neg' : '');
        const gdTxt = t.GD > 0 ? '+'+t.GD : t.GD;
        return `<tr class="${cls}"><td class="pos">${rank}</td>
          <td><div class="team-cell"><span class="fl">${countryFlag(t.code)}</span><span class="nm">${countryName(t.code)}</span></div></td>
          <td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td><td>${t.GF}:${t.GA}</td>
          <td class="${gdCls}">${gdTxt}</td><td class="pts">${t.Pts}</td></tr>`;
      }).join('');
      return `<div class="standings"><table><thead>${head}</thead><tbody>${body}</tbody></table>
        <div class="q-note">Top 2 advance to Round of 32. Best 3rd-placed teams may also qualify per FIFA seeding rules.</div></div>`;
    }

    // ============== OVERALL ==============
    async function renderOverall(){
      $('#sub-selector').classList.add('hidden');
      $('#list').innerHTML = '<div class="empty">Loading…</div>';
      const r = await window.WC_PROFILE.loadOverallLeaderboard();
      if (r.error) { $('#list').innerHTML = `<div class="empty">${r.error}</div>`; return; }
      if (!r.rows.length) { $('#list').innerHTML = '<div class="empty">No players yet.</div>'; return; }
      // Shares are computed from the unfiltered set (skip+promote handled inside computeEndPoolShares),
      // so a non-linked leader still doesn't get a share even with the toggle off. The toggle only
      // affects which rows are *shown* — and when shown, ranks re-number to match payout positions.
      const shares = computeEndPoolShares(r.rows);
      const rows = applyWalletFilter(r.rows);
      if (!rows.length) { $('#list').innerHTML = '<div class="empty">No wallet-linked players yet — toggle "All players" to see the full leaderboard.</div>'; return; }
      const html = rows.map((row, i) => userRow(row, i+1, {
        ptsLabel: 'pts',
        ptsValue: fmtPts(row.total_points || 0),
        prizeBobai: shares.get(row.user_id) || 0,
        contextPot: pool.end,
        medalRank: END_TOP_N,
      })).join('');
      const scrollCls = rows.length > 10 ? 'list scroll-cap' : 'list';
      const myIdx = me ? rows.findIndex(r0 => r0.user_id === me.id) : -1;
      const cutoff = rows[END_TOP_N - 1];
      const footer = meFooterHtml({
        rank: myIdx >= 0 ? myIdx + 1 : null,
        totalRows: rows.length,
        qualifierRank: END_TOP_N,
        qualifierPts: cutoff ? (cutoff.total_points || 0) : 0,
        myPts: myIdx >= 0 ? (rows[myIdx].total_points || 0) : 0,
        qualifiedCopy: `✓ You're in the End-Pool top ${END_TOP_N}`,
        needCopy: `+{n} pts to enter the End-Pool top ${END_TOP_N}`,
      });
      $('#list').innerHTML = `<div class="${scrollCls}">${html}</div>${footer}`;
    }

    // ============== GROUPS ==============
    async function loadAllGroupData(){
      if (allGroupData) return allGroupData;
      const arr = await Promise.all(GROUP_LETTERS.map(async L => {
        const r = await window.WC_PROFILE.loadGroupLeaderboard(L);
        return { letter: L, rows: r.rows || [] };
      }));
      allGroupData = arr;
      return arr;
    }

    async function renderGroup(letter){
      $('#list').innerHTML = '<div class="empty">Loading…</div>';
      const [allG, matches] = await Promise.all([ loadAllGroupData(), loadAllMatches() ]);
      const standings = computeStandings(matches, letter);
      const standingsHtml =
        `<div class="section-h"><span>Group ${letter} — FIFA standings</span><span class="right">${standings.reduce((a,t)=>a+t.P,0) ? 'live results' : 'matches not played yet'}</span></div>` +
        renderStandingsTable(standings, letter);

      const myGroup = allG.find(g => g.letter === letter);
      const rows = applyWalletFilter(myGroup ? myGroup.rows : []);

      // Build shares Map. Default = raw cascade-naive shares from leaderboard math.
      // Once the group pot is paid, overlay actual post-cascade amounts from
      // wc_payouts (which include 0-balance forfeits and redistributed bonuses).
      const shares = computeGroupShares(allG);
      const forfeits = new Set();
      let payoutRows = [];
      if (pool.groupPaidAt) {
        const r = await window.WC_PROFILE.loadPayouts('group');
        if (!r.error) {
          payoutRows = r.rows || [];
          for (const row of payoutRows) {
            shares.set(`${row.user_id}|${row.group_letter}`, Number(row.bobai_amount) || 0);
            if (Number(row.bobai_amount) === 0) forfeits.add(`${row.user_id}|${row.group_letter}`);
          }
        }
      }
      const best3InThisGroup = rows[2];
      const best3HasShare = best3InThisGroup
        && shares.has(`${best3InThisGroup.user_id}|${letter}`)
        && (shares.get(`${best3InThisGroup.user_id}|${letter}`) > 0);

      const paidDateStr = pool.groupPaidAt
        ? new Date(pool.groupPaidAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
        : '';
      const playerSection = pool.groupPaidAt
        ? `<div class="section-h"><span>Group ${letter} — payout <span class="settled-pill">✓ settled</span></span><span class="right">frozen ${paidDateStr}</span></div>`
          + `<div class="settled-note">Paid out <b>${paidDateStr}</b> and <b>frozen</b>. The three winners below received the amounts shown on-chain.</div>`
        : `<div class="section-h"><span>Group ${letter} — players (top 5)</span><span class="right">55 / 30 / 15 % split of group pot</span></div>`;
      let playerListHtml;
      let footer = '';
      if (!rows.length) {
        playerListHtml = `<div class="empty">No tips in Group ${letter} yet.</div>`;
      } else if (pool.groupPaidAt) {
        // ===== SETTLED VIEW =====
        // The group pot is paid out and frozen. The ONLY source of truth is
        // wc_payouts — never the live re-projection. We render the actual
        // winners first (in their paid 1st/2nd/best-3rd order, with their
        // real on-chain amounts), then the remaining players by live points
        // at 0. This stops a wallet that drifted into a top-3 live slot after
        // the freeze (daily $BOBAI tie-breaker shuffle) from showing a phantom
        // share it never received.
        // The group stage is over → group_points are final. The only thing that
        // still moves is the live $BOBAI tie-breaker, which must NOT re-order a
        // settled group. So: (a) pin the actual winners in their paid order,
        // (b) order everyone else by frozen group_points. The "holds more $BOBAI"
        // pill stays on genuine point-ties (userRow only shows it when
        // bobai_beats_below && a tie exists) — it explains which wallet won the
        // tiebreak that set the frozen payout order.
        const frozen = r => r;
        const POS_RANK = { '1st': 1, '2nd': 2, 'best_3rd': 3 };
        const winRows = payoutRows
          .filter(p => p.group_letter === letter)
          .slice()
          .sort((a, b) => (POS_RANK[a.position] || 9) - (POS_RANK[b.position] || 9));
        const winnerIds = new Set(winRows.map(w => w.user_id));
        const byId = new Map(rows.map(r => [r.user_id, r]));
        const meIdx = me ? rows.findIndex(r0 => r0.user_id === me.id) : -1;

        const winnerHtml = winRows.map((w, i) => {
          const base = byId.get(w.user_id) || {
            user_id: w.user_id, username: w.username,
            avatar_country: w.country_code, has_wallet: true, group_points: w.group_points,
          };
          const live = frozen(base);
          const amt = Number(w.bobai_amount) || 0;
          const isForfeit = amt === 0;
          return userRow(live, i + 1, {
            ptsLabel: 'pts',
            ptsValue: fmtPts(live.group_points || 0),
            prizeBobai: amt,
            contextPot: pool.group,
            extraClass: isForfeit ? 'forfeit' : (amt > 0 ? 'paid' : ''),
            forfeit: isForfeit,
            tiePast: true,
          });
        }).join('');

        const others = rows
          .filter(r => !winnerIds.has(r.user_id))
          .sort((a, b) => (b.group_points || 0) - (a.group_points || 0));
        const othersShown = others.slice(0, Math.max(0, 5 - winRows.length));
        const othersHtml = othersShown.map((r0, j) => userRow(frozen(r0), winRows.length + j + 1, {
          ptsLabel: 'pts',
          ptsValue: fmtPts(r0.group_points || 0),
          prizeBobai: 0,
          contextPot: pool.group,
          tiePast: true,
        })).join('');

        const shownIds = new Set([...winnerIds, ...othersShown.map(r => r.user_id)]);
        let meHtml = '';
        if (me && meIdx >= 0 && !shownIds.has(me.id)) {
          const meRow = rows[meIdx];
          const meFrozenRank = others.findIndex(r => r.user_id === me.id);
          meHtml = `<div class="rank-gap">···</div>` + userRow(frozen(meRow), winRows.length + (meFrozenRank >= 0 ? meFrozenRank + 1 : meIdx + 1), {
            ptsLabel: 'pts',
            ptsValue: fmtPts(meRow.group_points || 0),
            prizeBobai: 0,
            contextPot: pool.group,
            tiePast: true,
          });
        }
        const divider = othersHtml
          ? `<div class="settled-divider">— paid winners above · live standings below (no further payout) —</div>`
          : '';
        playerListHtml = `<div class="list">${winnerHtml}${divider}${othersHtml}${meHtml}</div>`;

        // Settled footer: tell me exactly what I won here (if anything).
        if (me) {
          const myWin = winRows.find(w => w.user_id === me.id);
          let statusHtml;
          if (myWin && Number(myWin.bobai_amount) > 0) {
            const pos = myWin.position === '1st' ? '1st' : myWin.position === '2nd' ? '2nd' : 'best 3rd';
            statusHtml = `<span class="mf-status qualified">✓ You won Group ${letter} ${pos} — ${fmtBobai(Number(myWin.bobai_amount))} BOBAI paid on-chain</span>`;
          } else if (myWin) {
            statusHtml = `<span class="mf-status need">Group ${letter} ${myWin.position === 'best_3rd' ? 'best 3rd' : myWin.position} — share cascaded (26× cap not reached)</span>`;
          } else {
            const myRank = meIdx >= 0 ? meIdx + 1 : null;
            statusHtml = `<span class="mf-status">Group ${letter} settled — you finished ${myRank ? '#' + myRank : 'unranked'}, outside the paid positions</span>`;
          }
          footer = `<div class="me-footer"><div class="mf-left"><span class="mf-status">Group ${letter} payout ✓ frozen</span></div><div>${statusHtml}</div></div>`;
        }
      } else {
        const top5 = rows.slice(0, 5);
        const meIdx = me ? rows.findIndex(r0 => r0.user_id === me.id) : -1;
        const meRowData = (meIdx >= 5) ? rows[meIdx] : null;
        const listHtml = top5.map((r0, i) => userRow(r0, i+1, {
          ptsLabel: 'pts',
          ptsValue: fmtPts(r0.group_points || 0),
          prizeBobai: shares.get(`${r0.user_id}|${letter}`) || 0,
          contextPot: pool.group,
        })).join('');
        const meHtml = meRowData
          ? `<div class="rank-gap">···</div>` + userRow(meRowData, meIdx + 1, {
              ptsLabel: 'pts',
              ptsValue: fmtPts(meRowData.group_points || 0),
              prizeBobai: shares.get(`${meRowData.user_id}|${letter}`) || 0,
              contextPot: pool.group,
            })
          : '';
        playerListHtml = `<div class="list">${listHtml}${meHtml}</div>`;

        const cutoffPlayer = rows[1] || rows[0];
        const cutoffPts = cutoffPlayer ? (cutoffPlayer.group_points || 0) : 0;
        const myPts = (meIdx >= 0) ? (rows[meIdx].group_points || 0) : 0;
        const myRank = (meIdx >= 0) ? meIdx + 1 : null;
        const qualifiedCopy = myRank === 1
          ? `✓ You're 1st in Group ${letter} — top-1 share`
          : `✓ You're 2nd in Group ${letter} — top-2 share`;
        const needCopy = (myRank === 3 && best3HasShare)
          ? `Currently qualifies as best-3rd · +{n} pts to lock top 2`
          : `+{n} pts to enter Group ${letter} top 2`;
        footer = meFooterHtml({
          rank: myRank, totalRows: rows.length,
          qualifierRank: 2, qualifierPts: cutoffPts, myPts,
          qualifiedCopy, needCopy,
        });
      }

      $('#list').innerHTML = standingsHtml + playerSection + playerListHtml + footer;
      if (window.twemoji) try { window.twemoji.parse($('#list'), { folder:'svg', ext:'.svg', base:'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/' }); } catch(e){}
    }

    // ============== BRACKET ==============
    function brTeam(code, align){
      const tbd = !code || code === 'TBD';
      const cls = ['br-team']; if (tbd) cls.push('tbd'); if (align === 'right') cls.push('away');
      const flag = tbd ? '⚪' : countryFlag(code);
      const name = tbd ? 'TBD' : countryName(code);
      if (align === 'right') return `<div class="${cls.join(' ')}"><span class="nm">${name}</span><span class="fl">${flag}</span></div>`;
      return `<div class="${cls.join(' ')}"><span class="fl">${flag}</span><span class="nm">${name}</span></div>`;
    }
    function brTeamWithWin(code, align, isWin){
      const html = brTeam(code, align);
      if (!isWin) return html;
      return html.replace('br-team', 'br-team win');

    function renderBracketMatchRow(m){
      const played = m.played && m.goals_home != null && m.goals_away != null;
      let hWin = false, aWin = false;
      if (played) { const s = matchWinnerSide(m); hWin = s === 'home'; aWin = s === 'away'; }
      const isFinal = m.phase === 'final';
      const time = m.kickoff_utc ? fmtKickoffShort(m.kickoff_utc) : '';
      const center = played
        ? `<div class="br-score played">${m.goals_home} : ${m.goals_away}${resultSuffix(m)}</div><div class="br-time">${time}</div>`
        : `<div class="br-vs">VS</div><div class="br-time">${time}</div>`;
      return `<div class="br-match ${played?'played':''} ${isFinal?'final':''}">
        ${brTeamWithWin(m.team_home, 'left',  hWin)}
        <div class="br-center">${center}</div>
        ${brTeamWithWin(m.team_away, 'right', aWin)}
      </div>`;
    }

      if (window.twemoji) try { window.twemoji.parse($('#list'), { folder:'svg', ext:'.svg', base:'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/' }); } catch(e){}

    // ============== BONUS ==============
    // State cache so switching between bonus sub-tabs doesn't re-fetch every time.
    let bonusData = null;

    async function loadBonusData(){
      if (bonusData) return bonusData;
      const [ba, sc, st, mt] = await Promise.all([
        window.WC_PROFILE.loadAllBonusAnswers(),
        window.WC_PROFILE.loadScorers(),
        window.WC_PROFILE.loadTournamentStats(),
        loadAllMatches(),
      ]);
      bonusData = {
        answers: ba.rows || [],
        scorers: sc.scorers || [],
        stats:   st.stats || { red_cards_total: 0 },
