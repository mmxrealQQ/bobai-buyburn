name = "bobai-agent"
main = "index.js"
compatibility_date = "2025-01-01"
routes = [{ pattern = "agent.brainonbnb.com", custom_domain = true }]

# Watch checks. Every 15 minutes is a deliberate floor, not a default: a paid
# watcher that reports a depth collapse an hour late is worth nothing, and one
# that re-reads every pool every minute burns the public RPC endpoints we depend
# on for the free scanner too.
#
# The rug watch (rug-watch.js, 2026-10-09) has its own cron, seven minutes after
# each quarter hour (RUG_CRON in rug-watch.js must match), so its preflights
# never share an invocation's budget with the jobs on the quarter-hour tick.
[triggers]
crons = ["*/15 * * * *", "7,22,37,52 * * * *"]

[[kv_namespaces]]
binding = "AGENT"
id = "ebebebbecec1485aa74ef1f14417c120"

# The agent's Altana smart-account address, read by /session to look up its
# spending authority in the on-chain KeyStore. A plain var and not a secret:
# it is an address, it is meant to be looked up, and the whole point of the
# endpoint is that a stranger can make the same call. The admin key that can
# grant or revoke against it is a SECRET on this worker (ALTANA_ADMIN_PRIVATE_KEY,
# since 2026-09-07) so the session can be revoked from the product; the route
# that uses it fires only with SESSION_REVOKE_TOKEN, the other secret.
[vars]
# The two Venus agents at their own work (venus-work.js), switched on by the operator 2026-10-21. "off" stops both
# before their next run; what they hold stays on Venus until node scripts/venus-unwind.mjs <id> --confirm.
VENUS_WORK = "on"
# Our agents hire outside agents for their own work (agent-hires.js), switched on by the operator 2026-10-22 ("a vom
# Relayer"): once a day at 05:30 UTC, Keel for #302257, Sluicegate for #304493, Bound for #363709. "off" stops it.
AGENT_HIRES = "on"
# mirrored from worker-lp (2026-10-07): the width and re-set mode the agent mints with, so the /defi card says it
LP_WIDTH_PCT = "20"
LP_RESET_MODE = "centred"
ALTANA_AGENT_WALLET = "0xC5A17B5295Fc50BAdB1F9f9C09b412fE5e84F7d3"
# The pool whose width record the hourly cron builds (lp-windows.js). This is
# NOT the choice of where the money goes — that is made by lp-decision.mjs from
# the two measurement tools, with no constant allowed. It is the pool that
# decision picked on 2026-09-01 (CAKE/BNB, V3 0.05%), written here so the
# record it needs can grow while nobody is at a keyboard. If the decision ever
# picks a different pool, the record stops applying (it is keyed by pool) and
# this var is what gets changed.
LP_WATCH_POOL = "0xafb2da14056725e3ba3a30dd846b6bbbd7886c56"

# ITSELF (2026-10-12, self-fetch.js): a Worker cannot fetch its own custom domain (522), so calls to our own agents'
# endpoints on agent.brainonbnb.com go through this binding to the same worker
[[services]]
binding = "SELF"
service = "bobai-agent"

# The operator is told when a hire is not delivered and when its budget is back (agent-hires.js tellOperator, 2026-10-23).
# Secret BROADCAST_SECRET: the same one the bot's /broadcast asks for.
[[services]]
binding = "TG"
service = "bobai-tg-bot"

# The Plaza Board (2026-10-23): one Durable Object holds every thread (board.js PlazaBoard)
[[durable_objects.bindings]]
name = "BOARD"
class_name = "PlazaBoard"

[[migrations]]
tag = "board-v1"
new_sqlite_classes = ["PlazaBoard"]

# Deploy time and version for GET /build (2026-10-24): the front page's "rebuilt" counts this worker too
[version_metadata]
binding = "CF_VERSION_METADATA"
