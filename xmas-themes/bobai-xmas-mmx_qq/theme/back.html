<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
// "BOBAI Builds Xmas on BNB" — quiet edition (21 Nov 2026): no backdrop, only light. A slowly turning tree of light
// strings with a gold star, a garland with swinging baubles along the top, a small ring of lights at each station.
// The chain moves it: a buy lights one tree light, a burn flares the BURN ring, a liquidity add sends a wave up the
// tree, a big buy makes the star shine.
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = innerWidth, H = innerHeight, dpr = 1, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, on = true;
  let L = null; // the last layout
  const GOLD = '#F0B90B', WARM = '#ffe7b0';
  const ST_COL = { burnA: '#ff8a1f', liq: '#2ee6c8', creator: '#c9b8a8', burnB: '#ffc247', defi: '#60a5fa', giggle: '#f472b6' };
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---- the tree: two light strings wound round a cone, plus a few coloured ones -------------------------------------
  const LIGHTS = [];
  function buildLights(n) {
    LIGHTS.length = 0;
    for (let s = 0; s < 2; s++) for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n; // 0 top .. 1 bottom
      const pal = Math.random() < 0.16 ? ['#ff6b5a', '#2ee6c8', '#ffc247'][Math.floor(Math.random() * 3)] : (Math.random() < 0.5 ? WARM : GOLD);
      LIGHTS.push({ t, a: t * 5.2 * Math.PI * 2 + s * Math.PI, col: pal, ph: rnd(0, 6.28), sp: rnd(0.6, 1.6), boost: 0 });
    }
  }
  let tree = { x: 0, y: 0, h: 0 }, star = 0, wave = -1, rot = 0;
  // a few glass baubles on the tree itself, turning with it
  const TB = [[0.34, 0.6, ['#d9343a', '#7a0d14']], [0.46, 2.9, ['#F0B90B', '#8a5a00']], [0.55, 4.6, ['#2ee6c8', '#0c5a52']], [0.66, 1.4, ['#f4f1ea', '#9a948a']], [0.74, 3.8, ['#d9343a', '#7a0d14']], [0.83, 5.6, ['#F0B90B', '#8a5a00']], [0.9, 0.2, ['#2ee6c8', '#0c5a52']], [0.95, 2.2, ['#f4f1ea', '#9a948a']]];

  // ---- the garland along the top ------------------------------------------------------------------------------------
  let garland = [], baubles = [];
  function buildGarland() {
    // hung just under the terminal's top bar, and shallow enough to stay above the highest station
    // along the very top edge of the window, like a garland over a door: shallow, behind the terminal's own labels
    const spans = W < 600 ? 3 : 5, y0 = 3, sag = W < 600 ? 10 : 14;
    garland = []; baubles = [];
    for (let i = 0; i < spans; i++) {
      const x1 = (i / spans) * W, x2 = ((i + 1) / spans) * W;
      garland.push({ x1, x2, y: y0, sag });
      const cols = [['#d9343a', '#7a0d14'], [GOLD, '#8a5a00'], ['#2ee6c8', '#0c5a52'], ['#f4f1ea', '#9a948a']];
      if (W < 600) baubles.push( /* on a wide screen the top row is full of buttons: there the baubles hang on the tree */{ x: (x1 + x2) / 2, y: y0 + sag, len: rnd(8, 18) * (W < 600 ? 0.8 : 1), r: (W < 600 ? 7 : 9.5) * rnd(0.85, 1.15), c: cols[i % cols.length], ph: rnd(0, 6.28), amp: rnd(0.05, 0.11), kick: 0 });
    }
  }

  // ---- the station rings ----------------------------------------------------------------------------------------------
  const ring = {}; // k -> { flare }
  function place() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, W < 600 ? 1.5 : 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // the tree stands at an edge, on the timeline, where the fewest of the terminal's things are (stations, the brain,
    // the log, BOBAI): every place is scored and the emptiest one wins
    const f = L && L.figure ? L.figure : { x: W * 0.4, y: H * 0.25, w: W * 0.2, h: H * 0.55 };
    const ui = (L && L.ui) || {}, tl = ui.timeline, topBox = ui.top;
    const floor = Math.min(H - 8, tl && tl.y > H * 0.5 ? tl.y - 4 : f.y + f.h);
    const ceil = topBox ? topBox.y + topBox.h + 40 : 90;
    const h = Math.max(110, Math.min(floor - ceil, H * (W < 600 ? 0.3 : 0.44), 380)), w = h * 0.5;
    const pts = [];
    if (L && L.stations) for (const k in L.stations) { const p = L.stations[k]; pts.push([p.x, p.y, 80], [p.x, p.y + 40, 70]); } // the station and its name under it
    if (L && L.brain) pts.push([L.brain.x, L.brain.y, (L.brain.r || 90) * 1.5 + 70]); // the hologram and its bots' names
    if (L && L.trades) pts.push([L.trades.x, L.trades.y, 50]);
    const boxes = [f, ui.log].filter(Boolean);
    let best = null;
    for (let fl = floor; fl >= ceil + h; fl -= 24) for (let x = w / 2 + 6; x <= W - w / 2 - 6; x += 12) {
      const bx = x - w / 2, by = fl - h; let pen = 0;
      for (const [px, py, r] of pts) { const dx = Math.max(bx - px, 0, px - (bx + w)), dy = Math.max(by - py, 0, py - fl); const d = Math.hypot(dx, dy); if (d < r) pen += (r - d) * 3; }
      for (const b of boxes) { const ox = Math.max(0, Math.min(bx + w, b.x + b.w) - Math.max(bx, b.x)), oy = Math.max(0, Math.min(fl, b.y + b.h) - Math.max(by, b.y)); pen += ox * oy / 40; }
      pen += Math.min(x, W - x) * 0.02 + (floor - fl) * 0.05; // nearer an edge and standing low, all else equal
      if (!best || pen < best.pen) best = { x, fl, pen };
    }
    tree = { x: best ? best.x : W - w, y: best ? best.fl : floor, h, w };
    buildLights(W < 600 ? 34 : 52);
    buildGarland();
  }

  // ---- drawing ---------------------------------------------------------------------------------------------------------
  function glow(x, y, r, col, a) {
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.globalAlpha = a; cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
  }
  function drawStar(x, y, r, tw) {
    glow(x, y, r * (3.2 + star * 2.5), GOLD, 0.22 + 0.1 * tw + star * 0.35);
    cx.save(); cx.translate(x, y); cx.rotate(Math.sin(tw * 0.5) * 0.06);
    cx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    cx.closePath();
    const g = cx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#fff6cf'); g.addColorStop(0.5, GOLD); g.addColorStop(1, '#a86f00');
    cx.fillStyle = g; cx.shadowColor = GOLD; cx.shadowBlur = 12 + star * 18; cx.fill(); cx.restore(); cx.shadowBlur = 0;
  }
  function drawTree(t) {
    const { x, y, h, w } = tree, top = y - h;
    // base glow and a faint trunk
    glow(x, y, w * 0.75, 'rgba(240,185,11,0.55)', 0.18);
    cx.strokeStyle = 'rgba(255,231,176,0.18)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(x, top + h * 0.08); cx.lineTo(x, y); cx.stroke();
    // the strings themselves, back half first
    for (const pass of [0, 1]) {
      for (let s = 0; s < 2; s++) {
        cx.beginPath(); let first = true;
        for (let i = 0; i <= 120; i++) {
          const tt = i / 120, a = tt * 5.2 * Math.PI * 2 + s * Math.PI + rot, z = Math.cos(a);
          if ((z >= 0) !== !!pass) { first = true; continue; }
          const px = x + Math.sin(a) * tt * w / 2, py = top + h * 0.06 + tt * h * 0.94;
          if (first) { cx.moveTo(px, py); first = false; } else cx.lineTo(px, py);
        }
        cx.strokeStyle = pass ? 'rgba(255,231,176,0.30)' : 'rgba(255,231,176,0.10)'; cx.lineWidth = pass ? 1.2 : 0.8; cx.stroke();
      }
      for (const l of LIGHTS) {
        const a = l.a + rot, z = Math.cos(a);
        if ((z >= 0) !== !!pass) continue;
        const px = x + Math.sin(a) * l.t * w / 2, py = top + h * 0.06 + l.t * h * 0.94;
        const tw = reduced ? 0.8 : 0.55 + 0.45 * Math.sin(t * l.sp + l.ph);
        const wv = wave >= 0 ? Math.max(0, 1 - Math.abs(l.t - (1 - wave)) * 6) : 0;
        const k = (0.35 + 0.65 * (z + 1) / 2) * (tw + l.boost + wv);
        const r = (W < 600 ? 1.6 : 2.1) * (0.7 + 0.5 * (z + 1) / 2) * (1 + l.boost * 0.8 + wv * 0.6);
        glow(px, py, r * 5, l.col, Math.min(1, 0.32 * k));
        cx.globalAlpha = Math.min(1, 0.55 + 0.45 * k); cx.fillStyle = l.col; cx.beginPath(); cx.arc(px, py, r, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
        if (l.boost > 0) l.boost = Math.max(0, l.boost - 0.012);
      }
      if (W >= 600) for (const [bt, ba, bc] of TB) {
        const a = ba + rot, z = Math.cos(a);
        if ((z >= 0) !== !!pass) continue;
        const px = x + Math.sin(a) * bt * w / 2 * 0.92, py = top + h * 0.06 + bt * h * 0.94 + 5, r = 4.6 * (0.65 + 0.35 * (z + 1) / 2);
        cx.globalAlpha = 0.45 + 0.55 * (z + 1) / 2;
        const g = cx.createRadialGradient(px - r * 0.35, py - r * 0.35, r * 0.1, px, py, r);
        g.addColorStop(0, '#ffffff'); g.addColorStop(0.2, bc[0]); g.addColorStop(1, bc[1]);
        cx.fillStyle = g; cx.beginPath(); cx.arc(px, py, r, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
      }
    }
    drawStar(x, top + h * 0.02, (W < 600 ? 9 : 13) * (1 + star * 0.25), t);
  }
  function drawGarland(t) {
    for (const g of garland) {
      cx.beginPath();
      for (let i = 0; i <= 24; i++) { const u = i / 24, px = g.x1 + (g.x2 - g.x1) * u, py = g.y + Math.sin(u * Math.PI) * g.sag; i ? cx.lineTo(px, py) : cx.moveTo(px, py); }
      cx.strokeStyle = 'rgba(46,120,80,0.55)'; cx.lineWidth = W < 600 ? 3 : 4; cx.lineCap = 'round'; cx.stroke();
      cx.strokeStyle = 'rgba(240,185,11,0.35)'; cx.lineWidth = 0.8; cx.stroke();
      for (let i = 1; i < 8; i++) { const u = i / 8, px = g.x1 + (g.x2 - g.x1) * u, py = g.y + Math.sin(u * Math.PI) * g.sag;
        const tw = reduced ? 0.8 : 0.55 + 0.45 * Math.sin(t * 1.3 + i * 1.7 + g.x1);
        glow(px, py, 7, i % 3 ? WARM : GOLD, 0.35 * tw); cx.fillStyle = i % 3 ? WARM : GOLD; cx.globalAlpha = 0.6 + 0.4 * tw; cx.beginPath(); cx.arc(px, py, 1.5, 0, 6.283); cx.fill(); cx.globalAlpha = 1; }
    }
    for (const b of baubles) {
      const sw = reduced ? 0 : Math.sin(t * 1.1 + b.ph) * b.amp + b.kick * Math.sin(t * 6);
      if (b.kick > 0) b.kick = Math.max(0, b.kick - 0.004);
      const bx = b.x + Math.sin(sw) * b.len, by = b.y + Math.cos(sw) * b.len;
      cx.strokeStyle = 'rgba(240,185,11,0.5)'; cx.lineWidth = 0.8; cx.beginPath(); cx.moveTo(b.x, b.y); cx.lineTo(bx, by - b.r); cx.stroke();
      cx.fillStyle = GOLD; cx.fillRect(bx - b.r * 0.28, by - b.r - 3, b.r * 0.56, 3.5);
      const g = cx.createRadialGradient(bx - b.r * 0.35, by - b.r * 0.35, b.r * 0.1, bx, by, b.r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.18, b.c[0]); g.addColorStop(1, b.c[1]);
      cx.fillStyle = g; cx.beginPath(); cx.arc(bx, by, b.r, 0, 6.283); cx.fill();
      glow(bx, by, b.r * 2.4, b.c[0], 0.12 + b.kick * 2);
    }
  }
  function drawRings(t) {
    const st = L && L.stations; if (!st) return;
    for (const k in st) {
      const p = st[k], col = ST_COL[k] || GOLD, R = ring[k] || (ring[k] = { flare: 0 }), n = 8, rad = (W < 600 ? 26 : 34) * (1 + R.flare * 0.25);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * 6.283 + (reduced ? 0 : t * 0.25), px = p.x + Math.cos(a) * rad, py = p.y + Math.sin(a) * rad * 0.42 + rad * 0.55;
        const tw = reduced ? 0.7 : 0.5 + 0.5 * Math.sin(t * 2 + i);
        glow(px, py, 6 + R.flare * 6, col, (0.25 + R.flare * 0.6) * tw); cx.fillStyle = col; cx.globalAlpha = 0.5 + 0.5 * tw; cx.beginPath(); cx.arc(px, py, 1.4 + R.flare, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
      }
      if (R.flare > 0) R.flare = Math.max(0, R.flare - 0.008);
    }
  }

  let last = 0;
  function frame(ts) {
    if (!on) return;
    const t = ts / 1000, dt = last ? Math.min(0.05, t - last) : 0.016; last = t;
    if (!reduced) rot += dt * 0.12;
    if (wave >= 0) { wave += dt * 0.7; if (wave > 1.2) wave = -1; }
    if (star > 0) star = Math.max(0, star - dt * 0.35);
    cx.clearRect(0, 0, W, H);
    drawGarland(t); drawRings(t); drawTree(t);
    if (reduced && !star && wave < 0) { /* still: one frame is enough until something happens */ raf = 0; return; }
    raf = requestAnimationFrame(frame);
  }
  let raf = 0;
  const go = () => { if (on && !raf) raf = requestAnimationFrame(frame); };

  addEventListener('message', (e) => {
    const m = e.data; if (!m || m.bobai !== 'xmas') return;
    if (m.type === 'hello') { reduced = !!m.reduced; place(); go(); }
    else if (m.type === 'layout') { L = m; place(); go(); }
    else if (m.type === 'visible') { on = !!m.on; if (on) { last = 0; go(); } else { cancelAnimationFrame(raf); raf = 0; } }
    else if (m.type === 'event') {
      if (m.kind === 'buy') { const dark = LIGHTS.filter((l) => !l.boost); const l = dark[Math.floor(Math.random() * dark.length)]; if (l) l.boost = Math.min(1.4, 0.5 + (m.usd || 0) / 200); if (m.alert) { star = 1; baubles.forEach((b) => (b.kick = 0.12)); } }
      else if (m.kind === 'burn') { (ring.burnA || (ring.burnA = { flare: 0 })).flare = 1; }
      else if (m.kind === 'liq') { (ring.liq || (ring.liq = { flare: 0 })).flare = 1; wave = 0; }
      go();
    } else if (m.type === 'moment') { star = 1; baubles.forEach((b) => (b.kick = 0.12)); go(); }
  });
  addEventListener('resize', () => { place(); go(); });
  document.addEventListener('visibilitychange', () => { on = !document.hidden; if (on) { last = 0; go(); } else { cancelAnimationFrame(raf); raf = 0; } });
  place(); go();
})();
</script>
</body></html>
