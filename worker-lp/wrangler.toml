name = "bobai-lp-agent"
main = "index.js"
compatibility_date = "2025-01-01"

# Once a day for the money steps: the collect floor is 0.002 BNB of fees, the
# sweep floor 0.004 BNB of income, and a fifty-dollar position in a 0.05% pool
# earns the first over days, not hours. 04:23 UTC is a quiet hour on the chain
# and shares no minute with the agent worker's own jobs (05:23 until
# 2026-09-08, moved an hour earlier at the operator's request).
# Every hour at :50 for the range alone: a position outside its range earns
# nothing, and the daily tick left it there for up to a day (2026-09-03: out
# from about 08:30 to the next daily tick). The check reads the position and the
# pool, and re-sets only once the price has been outside for the wait the
# width record measured (0 to 24 h; two hours was the set wait until 2026-09-09). :50
# is after the agent worker's window tick at :30, which the check reads.
[triggers]
# 04:23 the daily run; :50 the hourly range check; the deposit watch on the
# other tens (not :50 — two firings in the same minute would both try to wrap
# the same BNB and the second would revert).
crons = ["23 4 * * *", "50 * * * *", "0,10,20,30,40 * * * *"]

# The same KV namespace the agent worker reads, so agent.brainonbnb.com can
# serve /lp/agent from the record this worker writes. This worker itself has
# no custom domain and no public face beyond the secret-gated /run.
[[kv_namespaces]]
binding = "AGENT"
id = "ebebebbecec1485aa74ef1f14417c120"

# Whether the cron may re-set the range on its own when the price has left
# it. Was "0" until the first re-set had been run by hand and watched on
# 2026-09-02 (it worked, nine transactions); "1" since that night, on the
# operator's word. Still gated by the day test and the size floor. Was:
# (node scripts/lp-agent.mjs --step rebalance --confirm); the tick still plans
# it and records that it is due. Flip to "1" and deploy to hand it over.
# How much of each collect stays as capital, in percent; the rest buys
# $BOBAI the agent's wallet holds (since 2026-09-09; the buyback wallet before). "0" was the rule until 2026-09-04 (every fee to the
# buyback); "50" since, on the operator's word: the position grows out of
# its own fees, so the buyback's share grows with it. A value that is not
# 0–100 falls back to the default in shared/lp-guards.js (50), never to 0 or 100.
[vars]
LP_REBALANCE = "1"
# LP_RELOCATE is gone (2026-09-11): the agent stays in CAKE/BNB 0.05%,
# HOME_POOL in shared/lp-guards.js; the relocate step only says so.
LP_FEE_KEEP_PCT = "50"
# LP_LADDER (2026-09-16): "0" plans the buy ladder and records what it would
# do; "1" mints and grows the reserve range below the price from BNB that
# arrives while the main range is all of the other side above it. The first
# reserve is watched before the gate opens, as the first re-set was.
LP_LADDER = "1"

# Secrets, set with `wrangler secret put`, never in this file:
#   LP_PRIVATE_KEY              the liquidity wallet 0xbFAA69233741924eD5b9d5DAA9B4Bf7B84567F0A
#   X402_PRIVATE_KEY            the x402 income wallet 0x690E950214980BC329823A2DB2fD90C06Bd54dE4 (sweep)
#   AGENT_PROVIDER_PRIVATE_KEY  the job-provider income wallet 0x73809F69916FcF7Ddc5BB1315fBdf96A569a5963 (sweep)
#   HIT_SECRET                  the same shared secret the agent worker's /run-* routes use
# The two income keys sign one thing here: the sale of what arrived, paid to
# the liquidity wallet. Without them the sweep records a red line, not a quiet day.
