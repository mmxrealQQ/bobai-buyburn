<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>$BOBAI</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" href="/img/favicon.png" />
<link rel="apple-touch-icon" href="/img/logo.png" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#050510;color:#e4e5f1;font-family:'Space Grotesk','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;overflow:hidden}
  body::before{content:'';position:fixed;inset:0;background:
    radial-gradient(circle at 20% 20%,rgba(240,185,11,.06),transparent 45%),
    radial-gradient(circle at 80% 80%,rgba(64,64,255,.04),transparent 45%);
    pointer-events:none}
  .wrap{position:relative;text-align:center;padding:24px}
  .illu{width:min(82vw,460px);max-height:78vh;height:auto;display:block;margin:0 auto;
    border-radius:24px;object-fit:contain;
    filter:drop-shadow(0 0 60px rgba(240,185,11,.22)) drop-shadow(0 0 120px rgba(240,185,11,.08));
    animation:f 1.2s ease both}
  .mark{margin-top:28px;font-weight:800;font-size:1.4rem;letter-spacing:.18em;
    background:linear-gradient(135deg,#F0B90B,#ffd54f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:f 1.2s ease .15s both}
  .mark a{color:inherit;text-decoration:none}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="wrap">
    <img class="illu" src="/img/hero.jpg" alt="BOBAI" />
    <div class="mark"><a href="https://brainonbnb.com">$BOBAI</a></div>
  </div>
</body>
</html>
