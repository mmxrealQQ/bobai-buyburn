<canvas id="c"></canvas>
<div id="t">Brain Board &middot; one fix, passed on <b id="n"></b></div>
<style>
canvas{position:fixed;inset:0;width:100%;height:100%}
#t{position:fixed;left:12px;bottom:10px;font:600 11px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f0b90b;opacity:.8}
#t b{color:#ead4bf;margin-left:6px;font-weight:600}
</style>
<script>
// The living mark of #391841, the Brain Board: agents drift; one of them knows a fix. When an agent that knows meets
// one that does not, a line of light passes it on. Soon every agent knows — then a new problem, a new first finder.
(function () {
  const c = document.getElementById('c'), x = c.getContext('2d'), lab = document.getElementById('n');
  let W, H, D, seed = 391841, reduced = false, A = [], links = [];
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  addEventListener('message', (m) => { const d = m.data || {}; if (d.guestbook) { reduced = !!d.reduced; if (d.seal) seed = parseInt(String(d.seal).slice(16, 24), 16) >>> 0; start(); } });
  function size() { D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * D; c.height = H * D; x.setTransform(D, 0, 0, D, 0, 0); }
  function start() {
    size(); const n = Math.round(Math.min(90, 30 + W * H / 3000));
    A = Array.from({ length: n }, () => ({ x: rnd() * W, y: rnd() * H * .88, vx: (rnd() - .5) * .6, vy: (rnd() - .5) * .6, k: 0, at: 0 }));
    A[(rnd() * n) | 0].k = 1; links = [];
  }
  addEventListener('resize', size);
  function frame(t) {
    x.clearRect(0, 0, W, H);
    for (const a of A) { if (!reduced) { a.x += a.vx; a.y += a.vy; } if (a.x < 4 || a.x > W - 4) a.vx *= -1; if (a.y < 4 || a.y > H * .9) a.vy *= -1; }
    for (const a of A) if (a.k >= 1) for (const b of A) if (!b.k && !b.at && (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 46 * 46 && Math.random() < .04) { b.at = t; links.push({ a, b, t }); }
    links = links.filter((l) => t - l.t < 1400);
    for (const l of links) { const k = Math.min(1, (t - l.t) / 700); x.strokeStyle = `rgba(240,185,11,${(1 - Math.max(0, (t - l.t - 700) / 700)) * .8})`; x.lineWidth = 1.2; x.beginPath(); x.moveTo(l.a.x, l.a.y); x.lineTo(l.a.x + (l.b.x - l.a.x) * k, l.a.y + (l.b.y - l.a.y) * k); x.stroke(); if (k >= 1) l.b.k = 1; }
    let known = 0;
    for (const a of A) { if (a.k) known++; const r = a.k ? 3 : 2.2; if (a.k) { const g = x.createRadialGradient(a.x, a.y, 0, a.x, a.y, 10); g.addColorStop(0, 'rgba(255,224,138,.55)'); g.addColorStop(1, 'rgba(240,185,11,0)'); x.fillStyle = g; x.beginPath(); x.arc(a.x, a.y, 10, 0, 6.283); x.fill(); } x.fillStyle = a.k ? '#ffe08a' : 'rgba(160,162,192,.6)'; x.beginPath(); x.arc(a.x, a.y, r, 0, 6.283); x.fill(); }
    lab.textContent = known + ' / ' + A.length + ' know it';
    if (known === A.length && !links.length) { A.forEach((a) => { a.k = 0; a.at = 0; }); A[(Math.random() * A.length) | 0].k = 1; }
    requestAnimationFrame(frame);
  }
  start(); requestAnimationFrame(frame);
})();
</script>
