<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>back</title>
<style>
  /* back.html lies BEHIND BOBAI, over the terminal's 3D scene. Keep the page transparent where the scene should show. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<script>
  // The terminal tells this page what happens. Nothing here can reach the terminal, and it needs nothing back.
  // Every message: { bobai: 'xmas', v: 1, type, ... } — the guide (AGENTS.md) lists them all.
  let L = null; // the latest layout: where BOBAI, the stations and the terminal's own boxes are
  addEventListener('message', (e) => {
    const m = e.data; if (!m || m.bobai !== 'xmas') return;
    if (m.type === 'layout') L = m;
    // m.type: hello | layout | event | moment | pose | mood | visible
  });
</script>
</body>
</html>
